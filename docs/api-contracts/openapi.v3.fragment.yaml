openapi: 3.1.0
info:
  title: AI Engineering OS v3 API Fragment
  version: 3.0.0
  description: >-
    Canonical API contract for AI Remote Engineering OS (ADR-0041,
    ADR-0043, ADR-0047). T-009 lands the shared scaffold: security
    scheme, the P0 domain components (mirrored from the authoritative
    JSON Schemas in packages/shared-schemas/), and the cross-cutting
    Error / pagination envelopes. Per-service paths are added by their
    owning tickets (audit ingest + read -> T-004; resource CRUD ->
    T-005; session lifecycle -> T-006), each referencing these shared
    components. Code generation (oapi-codegen chi-server, ADR-0043;
    openapi-typescript, ADR-0047) is wired by those consumer tickets,
    not here.
servers:
  - url: /
    description: Same-origin deploy (ADR-0047).
security:
  - bearerAuth: []
# Operation tags scope per-service codegen (T-014): `oapi-codegen` runs with
# include-tags filtering so each service generates only its own chi-server
# surface from this one canonical contract.
tags:
  - name: audit
    description: Append-only audit chain authority (ADR-0045, T-004b).
  - name: resources
    description: Resource registry CRUD on services/api (T-005b).
  - name: auth
    description: Operator login + identity on services/api (T-015b, ADR-0046).
  - name: sessions
    description: Cockpit session control plane on services/api (T-016b, ADR-0048).
  - name: audit-read
    description: Operator-facing audit-timeline read-proxy on services/api (T-024; api authenticates the operator and reads audit-service with a service token, keeping the chain authority's write gate strict).
# Paths below the workstream/workflow/mcp/eval stubs are P1 module
# placeholders predating the P0 ladder; left untouched. P0 service
# paths are contributed by T-004 / T-005 / T-006 using the shared
# components defined at the end of this file.
#
# operationId convention for added paths: <verb><Entity>[Qualifier],
# e.g. listResources, createResource, getResource, terminateSession.
paths:
  /v1/workstreams:
    get:
      summary: List workstreams
      responses:
        '200': { description: OK }
    post:
      summary: Create workstream
      responses:
        '201': { description: Created }
  /v1/workstreams/{workstreamId}/runs:
    post:
      summary: Start workstream run
      responses:
        '202': { description: Accepted }
  /v1/workflows/compile:
    post:
      summary: Compile agent workflow
      responses:
        '200': { description: Compiled workflow }
  /v1/mcp/tool-calls:
    post:
      summary: Request governed MCP tool call
      responses:
        '202': { description: Tool call accepted or awaiting approval }
  /v1/evals/runs:
    post:
      summary: Start evaluation run
      responses:
        '202': { description: Eval queued }
  # --- audit-service (T-004b) -------------------------------------------------
  # Append-only chain authority (ADR-0045). Producers fan in over the
  # service-service capability edge; the service assigns id/prevHash/chainHash
  # and dedupes on idempotencyKey. Client-supplied chain fields are rejected.
  /v1/events:
    post:
      tags: [audit]
      operationId: appendEvent
      summary: Append an audit event (append-only; chain authority assigns the hashes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventIngest'
      responses:
        '200':
          description: >-
            Event appended, or — on a replayed idempotencyKey — the existing
            event returned unchanged (at-least-once dedup, ADR-0045). Returned
            only after the row + chained-hash extension commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [audit]
      operationId: listEvents
      summary: List audit events in chain order (forward-only cursor)
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of audit events in ascending chain order.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/events/{id}:
    get:
      tags: [audit]
      operationId: getEvent
      summary: Fetch a single audit event by its server-assigned id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # --- operator audit-timeline read-proxy (T-024, services/api) ---------------
  # services/api authenticates the operator (human-agent) and reads audit-service
  # with a service token, so the chain authority's write gate stays strict
  # service-only (it never accepts operator tokens). Same page shape as
  # /v1/events; tagged audit-read so only the api codegen picks it up.
  /v1/audit/events:
    get:
      tags: [audit-read]
      operationId: listAuditEvents
      summary: Operator audit timeline — a page of chained events (via the api read-proxy)
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of audit events in ascending chain order.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --- resource registry (T-005b, services/api) -------------------------------
  /v1/resources:
    post:
      tags: [resources]
      operationId: createResource
      summary: Register a resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [resources]
      operationId: listResources
      summary: List resources
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of resources.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resource'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [resources]
      operationId: getResource
      summary: Fetch a resource
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [resources]
      operationId: updateResource
      summary: Replace a resource's mutable fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '200':
          description: The updated resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [resources]
      operationId: deleteResource
      summary: Delete a resource
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # --- operator auth (T-015b, services/api) -----------------------------------
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Operator login — exchange credentials for a session cookie
      # Public: this endpoint issues the session, so it carries no bearer itself.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          # Cookie-shape is settled by ADR-0047 §Decision item "Auth-token storage":
          #   - aireos_session=<paseto>; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=28800
          #   - aireos_csrf=<32B-hex>;  Secure; SameSite=Strict; Path=/; Max-Age=28800  (not HttpOnly; JS reads to echo X-CSRF-Token)
          # The PASETO token itself is NOT in the response body — it stays opaque
          # to JS by construction. The body carries only the session expiry so
          # the SPA can render time-to-expiry without reading cookies.
          description: Session established. The session cookie + CSRF cookie are set via Set-Cookie headers; the body carries only the session expiry timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Clear the operator session and CSRF cookies
      # Public: any caller can clear stale cookies on their own browser even with
      # an expired/missing session. SameSite=Strict on the session cookie blocks
      # cross-site CSRF on logout (an attacker can only trigger a same-site POST).
      security: []
      responses:
        '204':
          description: Both cookies cleared. No body.
  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The verified capability of the current token (capability-edge UI, ADR-0047)
      responses:
        '200':
          description: The caller's identity + capability edge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401': { $ref: '#/components/responses/Unauthorized' }
  # --- cockpit sessions control plane (T-016b, services/api) ------------------
  # ADR-0048 §2: services/api owns the REST control plane; services/session-broker
  # owns the WebSocket data plane (/v1/sessions/{id}/stream, not in this contract).
  # Operator-driven routes gated on the existing human-agent + service-service
  # edges (the agent-remote-session edge is the data-plane edge, enforced by the
  # broker on the WS upgrade — see ADR-0048 §item-6 reconciliation in T-016b).
  /v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a session against a resource (created pending; broker activates it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Session created in 'pending' status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List the caller's sessions (operator-scoped; no cross-operator scope at v0.1.0)
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of the caller's sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [sessions]
      operationId: getSession
      summary: Fetch session metadata (caller must own the session)
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/end:
    post:
      tags: [sessions]
      operationId: endSession
      summary: End a session (control-plane intent; the broker tears down and emits session.close)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The session, transitioned toward closed (ended_at + closed_reason set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    # PASETO v4 local capability token (ADR-0046). The bearer value is
    # opaque to clients; format kept generic so codegen does not assume JWT.
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid capability token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Capability edge does not permit this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    # The three P0 domain schemas are mirrored from the authoritative
    # JSON Schema files in packages/shared-schemas/ (T-003). Those files
    # remain the human source-of-record; these mirrors exist so
    # oapi-codegen / openapi-typescript resolve them without external
    # file $refs. Keep the two in sync until a bundling step de-dups them.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      properties:
        nextCursor:
          type: string
        total:
          type: integer
    Resource:
      type: object
      required: [id, type, name]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [rdp, vnc, ssh, meshcentral, workspace, agentic_desktop]
        name:
          type: string
        siteId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    # Create/update body for /v1/resources (T-005b). id is server-assigned, so
    # it is not part of the input; additionalProperties:false rejects a
    # client-supplied id with 400.
    ResourceInput:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          enum: [rdp, vnc, ssh, meshcentral, workspace, agentic_desktop]
        name:
          type: string
        siteId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    # Cockpit session (ADR-0048). At v0.1.0 the only mode is 'terminal' and the
    # lifecycle is pending -> active -> closed|terminated (narrowed from the
    # T-003 superset to what the sessions table CHECK constraints actually allow,
    # migration 0002). castPath/castSha256 are NULL until the broker closes the
    # session and anchors the asciinema cast hash in the session.close event.
    Session:
      type: object
      required: [id, resourceId, operatorId, mode, status, startedAt]
      properties:
        id:
          type: string
        resourceId:
          type: string
        operatorId:
          type: string
        mode:
          type: string
          enum: [terminal]
        status:
          type: string
          enum: [pending, pending_approval, active, closed, terminated]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        closedReason:
          type: string
          enum: [idle, operator, broker_crash, ttl, policy_unavailable]
        castPath:
          type: string
        castSha256:
          type: string
    # Create body for POST /v1/sessions (T-016b). id/operatorId/status are
    # server-assigned; mode defaults to the only v0.1.0 value. additionalProperties
    # false rejects client-supplied server fields with 400.
    SessionCreate:
      type: object
      additionalProperties: false
      required: [resourceId]
      properties:
        resourceId:
          type: string
        mode:
          type: string
          enum: [terminal]
          default: terminal
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, timestamp, actor, edge, target]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        edge:
          type: string
          enum:
            - human-agent
            - agent-agent
            - agent-tool
            - agent-workspace
            - agent-repo
            - agent-memory
            - agent-remote-session
            - service-service
        target:
          type: string
        outcome:
          type: string
        evidencePacketId:
          type: string
        idempotencyKey:
          type: string
          description: UUID v7; the chain authority dedupes on this (ADR-0045).
        prevHash:
          type: string
          description: Assigned by the audit-service chain authority, not producers (ADR-0045).
        chainHash:
          type: string
          description: Assigned by the audit-service chain authority, not producers (ADR-0045).
    # The POST /v1/events request body (T-004b). The producer supplies only the
    # semantic fields; id, prevHash, and chainHash are assigned by the chain
    # authority (ADR-0045). additionalProperties:false rejects any client-
    # supplied chain field (prevHash/chainHash/id) with a 400 — a forged-chain
    # attempt cannot enter the pipeline. idempotencyKey is a body field, not a
    # header: it is the evidence-row identity minted at outbox enqueue and
    # replayed verbatim by the relay, so it travels with the payload.
    AuditEventIngest:
      type: object
      additionalProperties: false
      required: [timestamp, actor, edge, target, idempotencyKey]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Producer occurrence time (RFC3339). Distinct from the server ingest time.
        actor:
          type: string
        edge:
          type: string
          enum:
            - human-agent
            - agent-agent
            - agent-tool
            - agent-workspace
            - agent-repo
            - agent-memory
            - agent-remote-session
            - service-service
        target:
          type: string
        outcome:
          type: string
        evidencePacketId:
          type: string
        idempotencyKey:
          type: string
          description: UUID v7 minted at outbox enqueue; the chain authority dedupes on this (ADR-0045).
    # Operator auth (T-015b).
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      # ADR-0047 §Decision: the PASETO token is set in an HttpOnly cookie, not
      # returned in this body. The body carries only the session expiry so the
      # SPA can render time-to-expiry without reading cookies (HttpOnly hides
      # the session cookie's value, and the csrf cookie isn't the expiry source
      # of truth).
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the session cookie expires (RFC3339 UTC).
    Identity:
      type: object
      required: [subject, edge]
      properties:
        subject:
          type: string
        edge:
          type: string
