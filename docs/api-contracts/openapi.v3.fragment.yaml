openapi: 3.1.0
info:
  title: AI Engineering OS v3 API Fragment
  version: 3.0.0
  description: >-
    Canonical API contract for AI Remote Engineering OS (ADR-0041,
    ADR-0043, ADR-0047). T-009 lands the shared scaffold: security
    scheme, the P0 domain components (mirrored from the authoritative
    JSON Schemas in packages/shared-schemas/), and the cross-cutting
    Error / pagination envelopes. Per-service paths are added by their
    owning tickets (audit ingest + read -> T-004; resource CRUD ->
    T-005; session lifecycle -> T-006), each referencing these shared
    components. Code generation (oapi-codegen chi-server, ADR-0043;
    openapi-typescript, ADR-0047) is wired by those consumer tickets,
    not here.
servers:
  - url: /
    description: Same-origin deploy (ADR-0047).
security:
  - bearerAuth: []
# Operation tags scope per-service codegen (T-014): `oapi-codegen` runs with
# include-tags filtering so each service generates only its own chi-server
# surface from this one canonical contract.
tags:
  - name: audit
    description: Append-only audit chain authority (ADR-0045, T-004b).
  - name: resources
    description: Resource registry CRUD on services/api (T-005b).
  - name: auth
    description: Operator login + identity on services/api (T-015b, ADR-0046).
  - name: sessions
    description: Cockpit session control plane on services/api (T-016b, ADR-0048).
  - name: audit-read
    description: Operator-facing audit-timeline read-proxy on services/api (T-024; api authenticates the operator and reads audit-service with a service token, keeping the chain authority's write gate strict).
  - name: runs
    description: Operator-launched governed Runs on services/api (T-057, ADR-0061; the Workstream Engine's execution layer).
  - name: grants
    description: Operator-issued delegation grants on services/api (T-063, ADR-0062; the agent's bounded, revocable standing authority for agent-initiated Runs).
  - name: workstreams
    description: Chartered Workstreams on services/api (T-071, ADR-0063; the standing operator-chartered objective whose immutable template fires governed Runs on a schedule, bounded by its auto-issued delegation grant).
  - name: memories
    description: Persistent Scoped Memory on services/api (T-080, ADR-0064; the mutable, forgettable projection beside the immutable audit chain — accrued content-free evidence pointers plus operator-authored sealed notes, scoped to {workstream, run, operator}).
  - name: context-sources
    description: Layer 1 Live/Context Index operator surface on services/api (T-100, ADR-0066; charter-bound, operator-registered local context sources the agent-plane context.search tool reads at plan time — registration/list/remove only; the agent read path is a separate internal RPC, not in this fragment).
  - name: pairing
    description: QR device pairing + revocable paired operator sessions on services/api (T-114, ADR-0068 §D4-§D6; the product's first server-side session revocation primitive, narrowed to the approvals@1 scope — a scope within human-agent, not a new capability edge). Ships disabled by default (AIREOS_PAIRING_ENABLED=0); every route answers 404 while off (SEC-41).
  - name: policy-rules
    description: >-
      Operator-authored policy rule CRUD on services/api (T-151b, ADR-0074; the
      operator-facing surface over policy-service's internal /v1/rules plane,
      T-151a — api forwards, it does not re-implement rule storage). SEC-53
      (block): rules are operator-authored only — every route additionally
      enforces a handler-level human-agent capability guard, stricter than the
      blanket human-agent-or-service-service gate every other operator route
      relies on, because mcp-gateway holds a service-service token and must
      never be able to author, enable, disable, or delete a rule.
# Paths below the workstream/workflow/mcp/eval stubs are P1 module
# placeholders predating the P0 ladder; left untouched. P0 service
# paths are contributed by T-004 / T-005 / T-006 using the shared
# components defined at the end of this file.
#
# operationId convention for added paths: <verb><Entity>[Qualifier],
# e.g. listResources, createResource, getResource, terminateSession.
paths:
  # The /v1/workstreams placeholder stub (v3.0.1 P1 placeholder) was superseded at T-071
  # (ADR-0063) by the real chartered-Workstream contract further down this file — the
  # module is now BUILT; the remaining stubs below stay placeholders.
  /v1/workstreams/{workstreamId}/runs:
    post:
      summary: Start workstream run
      responses:
        '202': { description: Accepted }
  /v1/workflows/compile:
    post:
      summary: Compile agent workflow
      responses:
        '200': { description: Compiled workflow }
  /v1/mcp/tool-calls:
    post:
      summary: Request governed MCP tool call
      responses:
        '202': { description: Tool call accepted or awaiting approval }
  /v1/evals/runs:
    post:
      summary: Start evaluation run
      responses:
        '202': { description: Eval queued }
  # --- audit-service (T-004b) -------------------------------------------------
  # Append-only chain authority (ADR-0045). Producers fan in over the
  # service-service capability edge; the service assigns id/prevHash/chainHash
  # and dedupes on idempotencyKey. Client-supplied chain fields are rejected.
  /v1/events:
    post:
      tags: [audit]
      operationId: appendEvent
      summary: Append an audit event (append-only; chain authority assigns the hashes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditEventIngest'
      responses:
        '200':
          description: >-
            Event appended, or — on a replayed idempotencyKey — the existing
            event returned unchanged (at-least-once dedup, ADR-0045). Returned
            only after the row + chained-hash extension commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [audit]
      operationId: listEvents
      summary: List audit events (bidirectional seq-keyset cursor, server-side actor/outcome/edge filters, the governed-actions@1 preset; ADR-0067)
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/DirectionParam'
        - $ref: '#/components/parameters/ActorParam'
        - $ref: '#/components/parameters/OutcomeParam'
        - $ref: '#/components/parameters/EdgeParam'
        - $ref: '#/components/parameters/PresetParam'
      responses:
        '200':
          description: >-
            A page of audit events, contiguous in seq order for the requested
            direction (ascending by default; EVD-8). Filtered or preset reads
            return the newest/oldest N matches over the whole chain, not over
            a page (AUD-25).
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  page:
                    $ref: '#/components/schemas/AuditPageMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/events/{id}:
    get:
      tags: [audit]
      operationId: getEvent
      summary: Fetch a single audit event by its server-assigned id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # --- operator audit-timeline read-proxy (T-024, services/api) ---------------
  # services/api authenticates the operator (human-agent) and reads audit-service
  # with a service token, so the chain authority's write gate stays strict
  # service-only (it never accepts operator tokens). Same page shape as
  # /v1/events; tagged audit-read so only the api codegen picks it up.
  /v1/audit/events:
    get:
      tags: [audit-read]
      operationId: listAuditEvents
      summary: Operator audit timeline — a page of chained events, bidirectional cursor + server-side filters + the governed-actions@1 preset (via the api read-proxy; ADR-0067)
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/DirectionParam'
        - $ref: '#/components/parameters/ActorParam'
        - $ref: '#/components/parameters/OutcomeParam'
        - $ref: '#/components/parameters/EdgeParam'
        - $ref: '#/components/parameters/PresetParam'
      responses:
        '200':
          description: >-
            A page of audit events, contiguous in seq order for the requested
            direction (ascending by default; EVD-8). Filtered or preset reads
            return the newest/oldest N matches over the whole chain, not over
            a page (AUD-25). Passed through verbatim from audit-service
            (AUD-30) — same envelope shape as GET /v1/events.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  page:
                    $ref: '#/components/schemas/AuditPageMeta'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --- resource registry (T-005b, services/api) -------------------------------
  /v1/resources:
    post:
      tags: [resources]
      operationId: createResource
      summary: Register a resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [resources]
      operationId: listResources
      summary: List resources
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of resources.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Resource'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [resources]
      operationId: getResource
      summary: Fetch a resource
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [resources]
      operationId: deleteResource
      summary: Delete a resource
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # --- operator auth (T-015b, services/api) -----------------------------------
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Operator login — exchange credentials for a session cookie
      # Public: this endpoint issues the session, so it carries no bearer itself.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          # Cookie-shape is settled by ADR-0047 §Decision item "Auth-token storage":
          #   - aireos_session=<paseto>; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=28800
          #   - aireos_csrf=<32B-hex>;  Secure; SameSite=Strict; Path=/; Max-Age=28800  (not HttpOnly; JS reads to echo X-CSRF-Token)
          # The PASETO token itself is NOT in the response body — it stays opaque
          # to JS by construction. The body carries only the session expiry so
          # the SPA can render time-to-expiry without reading cookies.
          description: Session established. The session cookie + CSRF cookie are set via Set-Cookie headers; the body carries only the session expiry timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Clear the operator session and CSRF cookies
      # Public: any caller can clear stale cookies on their own browser even with
      # an expired/missing session. SameSite=Strict on the session cookie blocks
      # cross-site CSRF on logout (an attacker can only trigger a same-site POST).
      security: []
      responses:
        '204':
          description: Both cookies cleared. No body.
  /v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The verified capability of the current token (capability-edge UI, ADR-0047)
      responses:
        '200':
          description: The caller's identity + capability edge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401': { $ref: '#/components/responses/Unauthorized' }
  # --- agent identity (T-036, services/api → services/mcp-gateway) ------------
  /v1/agent-tokens:
    post:
      tags: [auth]
      operationId: issueAgentToken
      summary: Mint a scoped agent-tool capability token for an autonomous agent (AG-1..3; ADR-0056/0057)
      # Operator-gated (human-agent edge, via the global bearerAuth security) +
      # double-submit CSRF: an operator provisions an agent's short-lived (5-min)
      # agent-tool token, scoped to the resource(s) it may use (SEC-16). The token's
      # audience is the MCP gateway; the agent presents it as Bearer to
      # services/mcp-gateway. The mint is audit-chained (auth.agent-token.mint,
      # actor=operator, target=agent:<id>). A CLI sibling (task auth -- issue-agent,
      # for offline/break-glass bootstrap) is deferred — trigger: installed-stack
      # offline agent provisioning; it reuses auth.Signer.IssueAgent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTokenRequest'
      responses:
        '200':
          description: The minted agent-tool token + its expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # --- cockpit sessions control plane (T-016b, services/api) ------------------
  # ADR-0048 §2: services/api owns the REST control plane; services/session-broker
  # owns the WebSocket data plane (/v1/sessions/{id}/stream, not in this contract).
  # Operator-driven routes gated on the existing human-agent + service-service
  # edges (the agent-remote-session edge is the data-plane edge, enforced by the
  # broker on the WS upgrade — see ADR-0048 §item-6 reconciliation in T-016b).
  /v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a session against a resource (created pending; broker activates it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Session created in 'pending' status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List the caller's sessions (operator-scoped; no cross-operator scope at v0.1.0)
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of the caller's sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [sessions]
      operationId: getSession
      summary: Fetch session metadata (caller must own the session)
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/end:
    post:
      tags: [sessions]
      operationId: endSession
      summary: End a session (control-plane intent; the broker tears down and emits session.close)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The session, transitioned toward closed (ended_at + closed_reason set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/resolve:
    post:
      tags: [sessions]
      operationId: resolveSession
      summary: Approve or deny a session parked pending approval (ADR-0054; same-operator self-approval at v0.2.0)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionResolve'
      responses:
        '200':
          description: Approved → session 'pending' (broker may attach); denied → 'closed'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The session is not awaiting approval (already resolved or the approval expired).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # --- invocation approval (T-040, services/api -> services/mcp-gateway) -------
  # The operator-facing leg of MCP tool-invocation approval (ADR-0057 §4 / ADR-0059).
  # services/api (human-agent + double-submit CSRF) PROXIES these to the gateway's
  # internal service-service plane; the gateway owns the invocation + the reconcile.
  # Cookie/CSRF stay on api (ADR-0050) — the gateway has no browser surface.
  /v1/invocations:
    get:
      tags: [sessions]
      operationId: listInvocations
      summary: List tool invocations parked pending operator approval (AP-2 / FE-11)
      responses:
        '200':
          description: The parked invocations awaiting a decision (each carries its command, ADR-0059).
          content:
            application/json:
              schema:
                type: object
                required: [invocations]
                properties:
                  invocations:
                    type: array
                    items:
                      $ref: '#/components/schemas/PendingInvocation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: The gateway (decision plane) is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/invocations/{id}/resolve:
    post:
      tags: [sessions]
      operationId: resolveInvocation
      summary: Approve or deny a tool invocation parked pending approval (AP-2; ADR-0057 §4)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvocationResolve'
      responses:
        '200':
          description: Resolved — approve lets the invocation proceed; deny blocks it.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The invocation is not awaiting approval (already resolved or timed out).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The gateway (decision plane) is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # --- governed Runs (T-057, ADR-0061) ----------------------------------------
  # Operator-launched multi-step Runs (the Workstream Engine's execution layer).
  # Distinct from the /v1/workstreams/{id}/runs placeholder (the future P1
  # Workstream-owned runs). Launch inherits the global bearerAuth + (on the cookie
  # path) double-submit CSRF; it is informed + bounded (PERF-6). run.launched is
  # audited in the same transaction as the Run insert (AUD-9).
  /v1/runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Launch an operator-authored governed Run (ADR-0061; informed, bounded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '201':
          description: Run launched (created pending; the sequencer drives it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: The plan exceeds the maximum step count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active runs for this operator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [runs]
      operationId: listRuns
      summary: List the caller's Runs (operator-scoped; no cross-operator scope)
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of the caller's Runs.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Run'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [runs]
      operationId: getRun
      summary: Fetch a Run's status + per-step status (the caller must own it)
      responses:
        '200':
          description: The Run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/runs/{id}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a pending/running Run the caller owns (DUR-5; stop-future-steps)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Run was canceled.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Run is no longer cancelable (already terminal).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # /v1/runs/{id}/approve + /v1/runs/{id}/deny — the plan-preview park's resolution
  # (RUN-6, ADR-0065 §6; T-088). A submitted adaptive plan parks as a `proposed` Run
  # (Run.status is a FREE string — no enum added here or on Run); approve flips it to
  # pending and the existing sequencer drives it unchanged (the deferred run.launched
  # fires here, D1); deny is terminal (canceled + the distinct run.denied, C1). Both
  # inherit the global bearerAuth + double-submit CSRF, same posture as cancel above.
  /v1/runs/{id}/approve:
    post:
      tags: [runs]
      operationId: approveRun
      summary: Approve a proposed Run's reviewed plan (RUN-6; proposed -> pending)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Run was approved (now pending; the sequencer drives it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Run is not approvable (not in status 'proposed').
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/runs/{id}/deny:
    post:
      tags: [runs]
      operationId: denyRun
      summary: Deny a proposed Run's reviewed plan (RUN-6/C1; proposed -> canceled)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Run was denied (terminal canceled; run.denied chained beside run.canceled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Run is not deniable (not in status 'proposed').
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # /v1/grants — operator-issued delegation grants (ADR-0062; v0.6 agent-initiated Runs).
  # human-agent + double-submit CSRF; principal-owner-scoped. grant.issued / grant.revoked
  # are audited in the same transaction as the write (AUD-16). The grant is a SERVER-SIDE
  # record (SEC-26) — the agent holds nothing mintable; it names the grant at launch (T-065).
  /v1/grants:
    post:
      tags: [grants]
      operationId: createGrant
      summary: Issue an operator-authored delegation grant (ADR-0062; SEC-26)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCreate'
      responses:
        '201':
          description: Grant issued (active).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: The grant scope or bounds are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [grants]
      operationId: listGrants
      summary: List the caller's delegation grants (operator-scoped)
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of the caller's grants.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grant'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [grants]
      operationId: getGrant
      summary: Fetch a delegation grant (the caller must own it)
      responses:
        '200':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/grants/{id}/revoke:
    post:
      tags: [grants]
      operationId: revokeGrant
      summary: Revoke an active delegation grant the caller owns (ADR-0062 §7)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The grant was revoked.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The grant is no longer active (already revoked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # /v1/workstreams — chartered Workstreams (ADR-0063; v0.7). human-agent + double-submit
  # CSRF; principal-owner-scoped. Chartering is ONE consent act (GOV-8): the charter row +
  # its IMMUTABLE sealed template + the auto-issued delegation grant (grantee =
  # workstream:<id>) are created in one transaction, with workstream.chartered +
  # grant.issued chained from it (WS-2/AUD-18). Lifecycle verbs (pause/resume/retire) land
  # at T-074.
  /v1/workstreams:
    post:
      tags: [workstreams]
      operationId: createWorkstream
      summary: Charter a Workstream (ADR-0063; the one consent act — auto-issues its grant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkstreamCreate'
      responses:
        '201':
          description: Workstream chartered (active); first fire = charter + interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workstream'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: The charter is invalid — a sub-floor interval, a template outside its own scope or bounds (it could never fire), or grant bounds outside the issuance ceilings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [workstreams]
      operationId: listWorkstreams
      summary: List the caller's Workstreams (operator-scoped; no templates)
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: A page of the caller's Workstreams.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workstream'
                  page:
                    $ref: '#/components/schemas/PageMeta'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/workstreams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [workstreams]
      operationId: getWorkstream
      summary: Fetch a Workstream with its immutable template (the caller must own it)
      responses:
        '200':
          description: The Workstream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workstream'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # Lifecycle verbs (WS-5, ADR-0063 §7; T-074). Pause is SOFT (ticks stop, in-flight Runs
  # complete, the grant stays active); resume re-arms next fire = now + interval (no
  # catch-up fire); retire is the KILL SWITCH (terminal; one tx flips the charter AND
  # revokes its grant, then the grant's in-flight Runs are canceled — the DUR-7 cascade).
  /v1/workstreams/{id}/pause:
    post:
      tags: [workstreams]
      operationId: pauseWorkstream
      summary: Pause an active Workstream (soft — ticks stop; in-flight Runs complete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Workstream was paused.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Workstream is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/workstreams/{id}/resume:
    post:
      tags: [workstreams]
      operationId: resumeWorkstream
      summary: Resume a paused Workstream (next fire = now + interval; no catch-up)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Workstream was resumed.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Workstream is not paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/workstreams/{id}/retire:
    post:
      tags: [workstreams]
      operationId: retireWorkstream
      summary: Retire a Workstream (terminal — revokes its grant and cancels its in-flight Runs)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Workstream was retired (its grant revoked; in-flight Runs canceled).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The Workstream is already retired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # /v1/memories — Persistent Scoped Memory (ADR-0064; v0.8.0). human-agent + double-submit
  # CSRF; owner-scoped (permission_scope = the caller, bound server-side — never a param).
  # Reads take scopeType/scopeId; there is deliberately NO scope-existence check (GOV-7 —
  # the single-bootstrap-operator posture: reads are permission_scope-filtered, so a
  # foreign scope_id simply returns no rows, leaking nothing). Accrual (a terminal Run's
  # content-free evidence pointer) is IN-PROCESS, not a route (ADR-0064 §7). MemoryView
  # carries v0.8.0's full field set now so the forgetting verbs (T-081) and the UI (T-082)
  # need zero further codegen churn.
  /v1/memories:
    get:
      tags: [memories]
      operationId: listMemories
      summary: List the caller's memories for one scope (owner-scoped; ADR-0064 §7)
      parameters:
        - name: scopeType
          in: query
          required: true
          schema:
            type: string
            enum: [workstream, run, operator]
        - name: scopeId
          in: query
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: The caller's memories for the scope, id-ascending (PERF-9's pushed-down limit; default 50, max 200).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [memories]
      operationId: createMemory
      summary: Author a free-text memory (sealed at rest; ADR-0064 §2 secondary path)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreate'
      responses:
        '201':
          description: The memory was written (owner = the authenticated caller, bound server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: content exceeds the 64 KiB body cap (PERF-9).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: A validation failure — an unknown scopeType, empty content, confidence outside [0,1], or a non-future expiresAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # The forgetting verbs (T-081, ADR-0064 §3): redact / pin / unpin. Each is an
  # idempotent, owner-scoped flip on the once-only tombstone/pin guard (the
  # flipWithEvent precedent applied to memory). A no-op flip (already redacted /
  # already pinned or unpinned) still answers 200 with the current view — NOT 409
  # (D1, ratified): same desired end state, no duplicate event (the N1 silent no-op).
  # Same human-agent + double-submit CSRF posture as createMemory above.
  /v1/memories/{id}/redact:
    post:
      tags: [memories]
      operationId: redactMemory
      summary: Redact a memory (idempotent tombstone flip; erases content — never the audit chain, ADR-0064 §3)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The memory's current state (already redacted, or newly redacted — idempotent, D1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: The memory store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/memories/{id}/pin:
    post:
      tags: [memories]
      operationId: pinMemory
      summary: Pin a memory, exempting it from the expiry sweep (idempotent; ADR-0064 §3)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The memory's current state (already pinned, or newly pinned — idempotent, D1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: The memory store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/memories/{id}/unpin:
    post:
      tags: [memories]
      operationId: unpinMemory
      summary: Unpin a memory, making it eligible for the expiry sweep again (idempotent; ADR-0064 §3)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The memory's current state (already unpinned, or newly unpinned — idempotent, D1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: The memory store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # The share flip (MEM-6, ADR-0065 §3; T-091) — the pin/unpin shape exactly, PLUS a
  # 409: a redacted/expired (tombstoned) row can never be shared or unshared (D1),
  # distinguished at the handler from an ordinary idempotent re-flip (still 200).
  /v1/memories/{id}/share:
    post:
      tags: [memories]
      operationId: shareMemory
      summary: Share a memory into the agent-plane read (idempotent; MEM-6, ADR-0065 §3)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The memory's current state (already shared, or newly shared — idempotent, D1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The memory is tombstoned (redacted or expired) and can never be shared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The memory store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/memories/{id}/unshare:
    post:
      tags: [memories]
      operationId: unshareMemory
      summary: Unshare a memory, stopping future agent-plane reads (idempotent; MEM-6, ADR-0065 §3)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The memory's current state (already unshared, or newly unshared — idempotent, D1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The memory is tombstoned (redacted or expired) and can never be unshared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The memory store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # /v1/context-sources — Layer 1 Live/Context Index operator surface (ADR-0066 §1;
  # v0.10.0, T-100). human-agent + double-submit CSRF; owner-scoped (permission_scope =
  # the caller, bound server-side — never a param), the memories pattern exactly.
  # Charter-bound is the only v0.10 scope: registration binds a source to ONE
  # workstream, validated to be owned by the caller (a foreign/unknown charter answers
  # 404 — a source can never be bound to someone else's charter). The agent-plane read
  # (context.search) is a SEPARATE internal RPC (ADR-0056/0058 rule) — not in this
  # fragment.
  /v1/context-sources:
    get:
      tags: [context-sources]
      operationId: listContextSources
      summary: List the caller's context sources, optionally narrowed to one charter (owner-scoped; ADR-0066 §1)
      parameters:
        - name: workstreamId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The caller's context sources, id-ascending (unfiltered when workstreamId is omitted).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContextSource'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [context-sources]
      operationId: createContextSource
      summary: Register a charter-bound context source (data-only; the indexer marks an unreadable root errored on sweep, ADR-0066 §1/CTX-5)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterContextSourceRequest'
      responses:
        '201':
          description: The context source was registered (owner = the authenticated caller, bound server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The named workstream does not exist or is not owned by the caller (existence-hiding) — a source cannot be bound to someone else's charter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: A validation failure — an empty rootPath or workstreamId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The context-index store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/context-sources/{id}:
    delete:
      tags: [context-sources]
      operationId: deleteContextSource
      summary: Remove a context source (owner-scoped; stops future agent reads — cannot recall past ones, GOV-11)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The context source was removed (its chunks cascade-deleted, CTX-5).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: The context-index store is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # /v1/pairing-requests, /v1/paired-sessions — QR device pairing + the product's
  # first revocable operator session (ADR-0068 §D4-§D6/§D10-§D11; v0.12 "Access &
  # Onboarding", E-02, T-114a). This ticket lands the CONTRACT only: every
  # operation below is generated and wired to a handler that answers 404 while
  # AIREOS_PAIRING_ENABLED is unset (the shipped default, SEC-41) — see
  # services/api/internal/server/pairing.go. T-114b fills in the real bodies,
  # the per-request liveness check, approvals@1 enforcement, and the three
  # pairing.* audit events.
  #
  # New named components ONLY (CON-3, ADR-0068 §D11): the list route below does
  # NOT reference the shared limit/cursor/page-envelope components used by
  # seven other operations elsewhere in this file — it mints its own
  # PairingSessionsLimit / PairingSessionsCursor / PairingSessionsPage
  # instead, per the v0.11 T-106 lesson that a shared *schema* is as
  # dangerous as a shared parameter.
  /v1/pairing-requests:
    post:
      tags: [pairing]
      operationId: createPairingRequest
      summary: Request a device pairing (desktop operator; ADR-0068 §D6) — the response carries the one-time secret exactly once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRequestCreate'
      responses:
        '201':
          description: >-
            The pairing request was created. `secret` appears in a response
            body ONLY here — never on redeem, never on any list/get. The
            cockpit encodes it into the QR the phone scans (ADR-0068 §D6);
            only its hash is ever persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingRequestCreated'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Pairing is disabled on this deployment (AIREOS_PAIRING_ENABLED=0, the shipped default) — no oracle; identical to an unknown route (SEC-41, T-114a).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/pairing-requests/{id}/redeem:
    post:
      tags: [pairing]
      operationId: redeemPairingRequest
      summary: Redeem a one-time pairing secret from the device being paired (ADR-0068 §D6)
      # Public: the redeeming device has no session yet — it holds only the
      # fragment-carried secret (ADR-0068 §D6), never a bearer token. Mirrors
      # /v1/auth/login's public posture.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRedeemRequest'
      responses:
        '200':
          description: >-
            The secret was correct; a paired session was created and its
            cookie set via Set-Cookie (mirrors /v1/auth/login — the token
            itself stays opaque to JS). The body carries only the session's
            expiry, never the raw session id or the secret's hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingRedeemResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: >-
            The request id is unknown, malformed, expired, already consumed,
            OR the secret was wrong — collapsed into one answer (no oracle,
            mirroring SEC-34's per-request liveness posture) — or pairing is
            disabled on this deployment (T-114a).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/paired-sessions:
    get:
      tags: [pairing]
      operationId: listPairedSessions
      summary: List the caller's paired sessions, live and revoked alike (desktop operator; ADR-0068 §D4)
      parameters:
        - $ref: '#/components/parameters/PairingSessionsLimit'
        - $ref: '#/components/parameters/PairingSessionsCursor'
      responses:
        '200':
          description: A page of the caller's paired sessions.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PairedSession'
                  page:
                    $ref: '#/components/schemas/PairingSessionsPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Pairing is disabled on this deployment — no oracle; identical to an unknown route (SEC-41, T-114a).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/paired-sessions/{id}/revoke:
    post:
      tags: [pairing]
      operationId: revokePairedSession
      summary: Revoke a paired session the caller owns (ADR-0068 §D4 — the product's first revocable operator session)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The session was revoked (idempotent — already-revoked answers the same way).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown session, not owned by the caller, or pairing is disabled on this deployment — no oracle (SEC-41, T-114a).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # --- policy rules (T-151b, ADR-0074; forwards to policy-service's internal
  # /v1/rules plane, T-151a) -----------------------------------------------
  # SEC-53 (block): every operation here is additionally guarded, at the
  # handler level, to the human-agent capability edge ONLY — stricter than
  # the security: [bearerAuth] declaration below, which (like every other
  # operation in this fragment) only gets the caller as far as
  # gateByDeclaredSecurity's blanket human-agent-or-service-service check.
  # The contract cannot express "human-agent only, not service-service" as a
  # security requirement (RequireCapability enforces the same allowed-edge
  # set across every declared-security route), so the narrower rule is
  # enforced in the handler and proven by a negative test per initiator
  # class rather than by inspecting a contract-level capability tag (there
  # is no per-route tag to inspect).
  /v1/policy-rules:
    post:
      tags: [policy-rules]
      operationId: createPolicyRule
      summary: Author a policy rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRuleInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A rule already exists for this (subject, edge, action, target) tuple.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [policy-rules]
      operationId: listPolicyRules
      summary: List every policy rule, enabled and disabled alike
      responses:
        '200':
          description: Every policy rule, newest first. No pagination (CON-2) — the same no-filter contract as policy-service's store.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyRule'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/policy-rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [policy-rules]
      operationId: getPolicyRule
      summary: Fetch a policy rule
      responses:
        '200':
          description: The policy rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [policy-rules]
      operationId: patchPolicyRule
      summary: Enable or disable a policy rule (SEC-54 — a disabled rule goes inert without deleting its row)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRulePatch'
      responses:
        '200':
          description: The updated policy rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [policy-rules]
      operationId: deletePolicyRule
      summary: Delete a policy rule (the decisions it previously produced stay intact on the chain — SEC-54)
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    # PASETO v4 local capability token (ADR-0046). The bearer value is
    # opaque to clients; format kept generic so codegen does not assume JWT.
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    # --- audit read params (T-106, ADR-0067 §D9/CON-1) --------------------
    # New named components, referenced ONLY by GET /v1/events and GET
    # /v1/audit/events — never added to LimitParam/CursorParam above, which
    # are shared by every list route in the product (resources, runs, grants,
    # workstreams, memories, context-sources). Editing those would silently
    # change every list surface; these five are additive and scoped to the
    # two audit operations.
    DirectionParam:
      name: direction
      in: query
      required: false
      description: >-
        Which way the seq-keyset cursor walks. The contract default is `asc`
        (chain order — ADR-0067 §D2 keeps this the canonical read-side
        default); the operator UI (T-107) requests `desc` explicitly for its
        newest-first default (AUD-24).
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    ActorParam:
      name: actor
      in: query
      required: false
      description: Equality filter on actor, applied server-side over the whole chain (AUD-25).
      schema:
        type: string
    OutcomeParam:
      name: outcome
      in: query
      required: false
      description: Equality filter on outcome, applied server-side over the whole chain (AUD-25).
      schema:
        type: string
    EdgeParam:
      name: edge
      in: query
      required: false
      description: >-
        Equality filter on edge, applied server-side over the whole chain
        (AUD-25). The enum is the closed, stable set of capability edges
        (ADR-0046) — the same set as AuditEvent.edge.
      schema:
        type: string
        enum:
          - human-agent
          - agent-agent
          - agent-tool
          - agent-workspace
          - agent-repo
          - agent-memory
          - agent-remote-session
          - service-service
    PresetParam:
      name: preset
      in: query
      required: false
      description: >-
        A named, versioned read-time lens (ADR-0067 §D3). A string enum, not
        a boolean, so the applied lens can be named and reported back in the
        envelope (AUD-28) — currently the sole value is `governed-actions@1`,
        which excludes the content-free charter-lifecycle outcomes
        `plan.requested` and `plan.expired`.
      schema:
        type: string
        enum: [governed-actions@1]
    # --- pairing params (T-114a, ADR-0068 §D11) ----------------------------
    # New named components, referenced ONLY by GET /v1/paired-sessions — the
    # shared limit/cursor parameters above are intentionally left untouched
    # (CON-3): a page-shape param is as reusable-and-dangerous as a shared
    # response envelope schema, per the same v0.11 T-106 lesson that stopped
    # the page-envelope schema below from being extended.
    PairingSessionsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PairingSessionsCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid capability token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Capability edge does not permit this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    # The three P0 domain schemas are mirrored from the authoritative
    # JSON Schema files in packages/shared-schemas/ (T-003). Those files
    # remain the human source-of-record; these mirrors exist so
    # oapi-codegen / openapi-typescript resolve them without external
    # file $refs. Keep the two in sync until a bundling step de-dups them.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      properties:
        nextCursor:
          type: string
        total:
          type: integer
    # AuditPageMeta (T-106, ADR-0067 §D9/CON-1) is a NEW schema, not an
    # extension of PageMeta above. PageMeta is referenced by eight operations
    # (resources, runs, grants, workstreams, memories, context-sources, and
    # both audit routes) — adding chainHead/preset/filter-echo fields there
    # would leak audit-only concepts onto every list response in the product.
    # This is a superset of PageMeta's shape (nextCursor is repeated, not
    # $ref'd, so the two schemas independently satisfy CON-2's "additive
    # only, nothing removed or narrowed"); it is referenced ONLY by GET
    # /v1/events and GET /v1/audit/events.
    AuditPageMeta:
      type: object
      properties:
        nextCursor:
          type: string
        total:
          type: integer
        chainHead:
          type: integer
          format: int64
          description: >-
            MAX(seq) — the newest position in the whole chain, O(1) (AUD-29,
            PERF-9). Always populated, filtered or not (EVD-8 requires the
            chain's size be disclosed whenever the view is reduced; always-on
            is simpler and equally honest for the unfiltered case).
        preset:
          type: string
          enum: [governed-actions@1]
          description: The named preset applied to this read, when one was requested (AUD-28). Absent when no preset was applied.
        actor:
          type: string
          description: The actor filter applied to this read, when one was requested (AUD-25/EVD-8 disclosure). Absent when unfiltered.
        outcome:
          type: string
          description: The outcome filter applied to this read, when one was requested (AUD-25/EVD-8 disclosure). Absent when unfiltered.
        edge:
          type: string
          description: The edge filter applied to this read, when one was requested (AUD-25/EVD-8 disclosure). Absent when unfiltered.
    AgentTokenRequest:
      type: object
      required: [agentId, resourceId]
      properties:
        agentId:
          type: string
          description: Logical agent id; the token subject is agent:<agentId>.
        resourceId:
          type: string
          description: The resource the agent may target (the token scope; SEC-16).
        operations:
          type: array
          items:
            type: string
          description: Allowed operations on the scoped resource (e.g. ["exec"]).
    AgentTokenResponse:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: The agent-tool capability token (Bearer; audience mcp-gateway, 5-min TTL).
        expiresAt:
          type: string
          format: date-time
    Resource:
      type: object
      required: [id, type, name]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [rdp, vnc, ssh, meshcentral, workspace, agentic_desktop]
        name:
          type: string
        siteId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    # Create/update body for /v1/resources (T-005b). id is server-assigned, so
    # it is not part of the input; additionalProperties:false rejects a
    # client-supplied id with 400.
    ResourceInput:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          enum: [rdp, vnc, ssh, meshcentral, workspace, agentic_desktop]
        name:
          type: string
        siteId:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    # Cockpit session (ADR-0048). At v0.1.0 the only mode is 'terminal' and the
    # lifecycle is pending -> active -> closed|terminated (narrowed from the
    # T-003 superset to what the sessions table CHECK constraints actually allow,
    # migration 0002). castPath/castSha256 are NULL until the broker closes the
    # session and anchors the asciinema cast hash in the session.close event.
    Session:
      type: object
      required: [id, resourceId, operatorId, mode, status, startedAt]
      properties:
        id:
          type: string
        resourceId:
          type: string
        operatorId:
          type: string
        mode:
          type: string
          enum: [terminal]
        status:
          type: string
          enum: [pending, pending_approval, active, closed, terminated]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        closedReason:
          type: string
          enum: [idle, operator, broker_crash, ttl, policy_unavailable, approval_denied, approval_timeout]
        castPath:
          type: string
        castSha256:
          type: string
    # Create body for POST /v1/sessions (T-016b). id/operatorId/status are
    # server-assigned; mode defaults to the only v0.1.0 value. additionalProperties
    # false rejects client-supplied server fields with 400.
    SessionCreate:
      type: object
      additionalProperties: false
      required: [resourceId]
      properties:
        resourceId:
          type: string
        mode:
          type: string
          enum: [terminal]
          default: terminal
    # Approve/deny body for POST /v1/sessions/{id}/resolve (ADR-0054, T-031b-ii).
    # The operator's intent in operator verbs (approve|deny); services/api maps it
    # to the policy decision (granted|denied).
    SessionResolve:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
    # Parked tool invocation awaiting operator approval (ADR-0057/0059). command is
    # the persisted approval payload — operator-only, surfaced solely on this proxied
    # operator read, never on the agent plane.
    PendingInvocation:
      type: object
      required: [id, agent, resourceId, tool, command, status]
      properties:
        id:
          type: string
        agent:
          type: string
        resourceId:
          type: string
        tool:
          type: string
        command:
          type: string
        status:
          type: string
        principal:
          type: string
          description: >-
            The delegating operator when this parked step is agent-driven under a
            delegation grant (ADR-0062, FE-18) — the approver sees the agent is acting
            on the operator's behalf. Absent for an operator-direct Run step or an
            agent-tool invocation.
        runId:
          type: string
          description: >-
            The parent Run id when this parked invocation is a governed Run step
            (FE-16); absent for a non-Run agent invocation. Derived by services/api
            from the step idempotency key — the raw key never crosses to the client.
        stepIndex:
          type: integer
          description: >-
            The zero-based step position within the Run (FE-16). Absent for a non-Run
            invocation.
        grantId:
          type: string
          description: >-
            The bounding delegation grant when this parked step is agent-driven
            (ADR-0062, GOV-6) — with agent + principal it completes the delegated
            context the approving human needs. Joined by services/api from the Run
            row; absent for an operator-direct step or a plain agent invocation.
    # Approve/deny body for POST /v1/invocations/{id}/resolve. Operator verbs
    # (approve|deny); services/api maps them to the policy decision (granted|denied).
    InvocationResolve:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, deny]
    RunCreate:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        steps:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [resourceId, command]
            properties:
              resourceId:
                type: string
              command:
                type: string
    Run:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
        actor:
          type: string
          description: >-
            The agent that drove a delegated Run (FE-19, ADR-0062) — the /runs view labels it
            agent-driven. Absent for an operator-direct Run (actor = the launching operator).
        grantId:
          type: string
          description: The bounding delegation grant for a delegated Run (FE-19). Absent for operator-direct.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RunStepView'
    RunStepView:
      type: object
      required: [stepIndex, resourceId, status]
      properties:
        stepIndex:
          type: integer
        resourceId:
          type: string
        status:
          type: string
        outcome:
          type: string
        invocationId:
          type: string
          description: The gateway invocation id once the step is dispatched — the read-time evidence-packet anchor into the hash-linked audit chain (AUD-15). Absent until dispatched.
        command:
          type: string
          description: >-
            The step's operator-authored command — present ONLY when the parent Run's
            status is 'proposed' (D2, ADR-0065 §6): the plan-preview review surface for
            a composer-submitted adaptive plan, on GetRun only. Absent for every other
            status and every other view (the ADR-0059 operator-only persisted-command
            posture; here inverted because the operator has not yet seen this plan).
    GrantCreate:
      type: object
      additionalProperties: false
      required: [agent, resources, verbs, ttlSeconds, maxStepsPerRun, maxConcurrentRuns, stepBudget]
      properties:
        agent:
          type: string
          description: The grantee agent subject this grant authorizes.
        label:
          type: string
          description: Operator-facing name for the grant.
        resources:
          type: array
          minItems: 1
          items:
            type: string
        verbs:
          type: array
          minItems: 1
          items:
            type: string
        ttlSeconds:
          type: integer
          minimum: 1
          description: Grant lifetime in seconds; expiresAt is computed as now + ttlSeconds.
        maxStepsPerRun:
          type: integer
          minimum: 1
        maxConcurrentRuns:
          type: integer
          minimum: 1
        stepBudget:
          type: integer
          minimum: 1
          description: Total steps across all the grant's Runs (the cap; SEC-29).
    Grant:
      type: object
      required: [id, agent, resources, verbs, expiresAt, maxStepsPerRun, maxConcurrentRuns, stepBudget, status, createdAt]
      properties:
        id:
          type: string
        agent:
          type: string
        label:
          type: string
        resources:
          type: array
          items:
            type: string
        verbs:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        maxStepsPerRun:
          type: integer
        maxConcurrentRuns:
          type: integer
        stepBudget:
          type: integer
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkstreamStep:
      type: object
      additionalProperties: false
      required: [resourceId, command]
      properties:
        resourceId:
          type: string
        command:
          type: string
          description: Operator-authored; sealed at rest server-side (F3 parity), operator-readable on the detail view.
    WorkstreamCreate:
      type: object
      additionalProperties: false
      required: [objective, resources, verbs, ttlSeconds, intervalSeconds, maxStepsPerRun, maxConcurrentRuns, stepBudget]
      properties:
        label:
          type: string
          description: Operator-facing name for the charter.
        objective:
          type: string
          description: The chartered objective (reviewed at consent; GOV-8).
        kind:
          type: string
          enum: [template, adaptive]
          default: template
          description: >-
            template (the default) instantiates the immutable steps array below
            verbatim every tick. adaptive names a composer agent instead and must
            carry NO steps — each tick opens a durable plan request that the composer
            answers over the gateway (ADR-0065 §4/§5); the auto-issued grant's
            grantee is the named composer (R2).
        composer:
          type: string
          description: >-
            The named composer agent subject — REQUIRED when kind is adaptive, and
            MUST be absent/empty when kind is template (the store's kind matrix is the
            single validator; a mismatch answers 422). Becomes the auto-issued grant's
            grantee for an adaptive charter (R2, ADR-0065 §4).
        resources:
          type: array
          minItems: 1
          items:
            type: string
          description: The charter scope — becomes the auto-issued grant's resources; every template step must target one of these.
        verbs:
          type: array
          minItems: 1
          items:
            type: string
        ttlSeconds:
          type: integer
          minimum: 1
          description: Charter (= grant) lifetime in seconds.
        intervalSeconds:
          type: integer
          minimum: 1
          description: The fixed schedule interval; must be at or above the server's floor (PERF-8). First fire = charter + interval.
        maxStepsPerRun:
          type: integer
          minimum: 1
        maxConcurrentRuns:
          type: integer
          minimum: 1
        stepBudget:
          type: integer
          minimum: 1
        budgetWindowSeconds:
          type: integer
          minimum: 1
          description: Rolling budget window (WS-4) — the step budget counts only Runs created within it. Omitted → defaults to the interval ("steps per period").
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkstreamStep'
          description: >-
            The IMMUTABLE plan template (edit = retire + re-charter). Required
            (minItems 1) for a template charter (the default); MUST be omitted or
            empty for an adaptive charter — the store's kind matrix enforces this
            (422 on a mismatch), not this field's own presence.
    WorkstreamPlanRequestView:
      type: object
      required: [id, status, expiresAt]
      properties:
        id:
          type: string
        status:
          type: string
          description: open | submitted | expired | closed (PLAN-1, ADR-0065 §5).
        expiresAt:
          type: string
          format: date-time
        runId:
          type: string
          description: The `proposed` Run this request's plan.submit created; absent until submitted.
    Workstream:
      type: object
      required: [id, objective, grantId, intervalSeconds, nextFireAt, status, createdAt, kind]
      properties:
        id:
          type: string
        label:
          type: string
        objective:
          type: string
        grantId:
          type: string
          description: The charter's auto-issued delegation grant (1:1; retire revokes it).
        intervalSeconds:
          type: integer
        nextFireAt:
          type: string
          format: date-time
        status:
          type: string
          description: active | paused | retired (ADR-0063 §7).
        createdAt:
          type: string
          format: date-time
        kind:
          type: string
          enum: [template, adaptive]
          description: template | adaptive (WS-5, ADR-0065 §4); existing pre-v0.9 charters are template.
        composer:
          type: string
          description: The named composer agent subject for an adaptive charter (R2, ADR-0065 §4); absent for a template charter.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkstreamStep'
          description: The immutable template — detail view only (absent on list items); empty for an adaptive charter.
        planRequests:
          type: array
          items:
            $ref: '#/components/schemas/WorkstreamPlanRequestView'
          description: >-
            The charter's most recent plan requests, newest first, capped at 10 (D3,
            ADR-0065 §5) — detail view only (absent on list items), like steps.
    MemoryCreate:
      type: object
      additionalProperties: false
      required: [scopeType, scopeId, content]
      properties:
        scopeType:
          type: string
          enum: [workstream, run, operator]
        scopeId:
          type: string
        key:
          type: string
          description: Operator-facing name for the memory (optional).
        content:
          type: string
          description: Free-text note; sealed at rest server-side (F3 parity), operator-only on read (ADR-0064 §2 secondary path). Capped at 64 KiB (PERF-9).
        sourceTrace:
          type: string
          description: What produced the note (optional; defaults to "operator").
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Recorded, never computed (an L3 concern, deferred). Defaults to 1.0 when omitted.
        expiresAt:
          type: string
          format: date-time
          description: Optional; must be in the future. Unpinned rows past this are tombstoned by the expiry sweep (T-081).
    MemoryView:
      type: object
      required: [id, scopeType, scopeId, ref, hasContent, sourceTrace, confidence, pinned, agentVisible, createdAt]
      properties:
        id:
          type: string
        scopeType:
          type: string
          enum: [workstream, run, operator]
        scopeId:
          type: string
        key:
          type: string
        ref:
          type: string
          description: The content-free evidence pointer (run/step/invocation ids + evidence-packet linkage) — never command text or stdout.
        hasContent:
          type: boolean
          description: True when the row carries sealed content (an authored note) — distinguishes "" content from no content.
        content:
          type: string
          description: Present only when hasContent is true and the row is not redacted; opened from the sealed-at-rest bytes on read.
        sourceTrace:
          type: string
        confidence:
          type: number
          format: float
        pinned:
          type: boolean
          description: Exempts the row from the expiry sweep (T-081).
        agentVisible:
          type: boolean
          description: >-
            The share flip's current state (MEM-6, ADR-0065 §3): true once an
            operator-authored row has been shared into the agent-plane read
            (memory.read). Default false at write time. A content-free accrued row
            (hasContent=false) is always agent-readable regardless of this flag
            (memory/store.go's ReadForAgent filter) — the UI must not offer a share
            toggle for those rows (it would be a lying control).
        expiresAt:
          type: string
          format: date-time
        redactedAt:
          type: string
          format: date-time
          description: Set once a redact tombstones the row (T-081); the fact, never the erased content.
        createdAt:
          type: string
          format: date-time
    RegisterContextSourceRequest:
      type: object
      additionalProperties: false
      required: [rootPath, workstreamId]
      properties:
        rootPath:
          type: string
          description: The local/mounted directory the indexer may read (SEC-33 confines the reader to this root). Registration is data-only — never stat'd/validated here (ADR-0066 §1; an unreadable root is marked errored on the next sweep, CTX-5).
        workstreamId:
          type: string
          description: The charter this source is bound to (ADR-0066 §1) — must be a workstream the caller owns; a foreign or unknown id is rejected (404).
    ContextSource:
      type: object
      additionalProperties: false
      required: [id, rootPath, scopeType, scopeId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        rootPath:
          type: string
        scopeType:
          type: string
          enum: [workstream]
          description: Charter-bound is the only v0.10 scope (ADR-0066 §1); operator-shared/run-scoped sources are deferred.
        scopeId:
          type: string
          description: The bound workstream (charter) id.
        status:
          type: string
          enum: [active, errored]
          description: errored surfaces an unreadable/absent root (CTX-5) rather than crashing the sweep.
        lastIndexedAt:
          type: string
          format: date-time
          description: Nil until the first sweep completes — its absence/staleness is the source's freshness signal (CTX-3).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, timestamp, actor, edge, target]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        edge:
          type: string
          enum:
            - human-agent
            - agent-agent
            - agent-tool
            - agent-workspace
            - agent-repo
            - agent-memory
            - agent-remote-session
            - service-service
        target:
          type: string
        outcome:
          type: string
        evidencePacketId:
          type: string
        idempotencyKey:
          type: string
          description: UUID v7; the chain authority dedupes on this (ADR-0045).
        prevHash:
          type: string
          description: Assigned by the audit-service chain authority, not producers (ADR-0045).
        chainHash:
          type: string
          description: Assigned by the audit-service chain authority, not producers (ADR-0045).
    # The POST /v1/events request body (T-004b). The producer supplies only the
    # semantic fields; id, prevHash, and chainHash are assigned by the chain
    # authority (ADR-0045). additionalProperties:false rejects any client-
    # supplied chain field (prevHash/chainHash/id) with a 400 — a forged-chain
    # attempt cannot enter the pipeline. idempotencyKey is a body field, not a
    # header: it is the evidence-row identity minted at outbox enqueue and
    # replayed verbatim by the relay, so it travels with the payload.
    AuditEventIngest:
      type: object
      additionalProperties: false
      required: [timestamp, actor, edge, target, idempotencyKey]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Producer occurrence time (RFC3339). Distinct from the server ingest time.
        actor:
          type: string
        edge:
          type: string
          enum:
            - human-agent
            - agent-agent
            - agent-tool
            - agent-workspace
            - agent-repo
            - agent-memory
            - agent-remote-session
            - service-service
        target:
          type: string
        outcome:
          type: string
        evidencePacketId:
          type: string
        idempotencyKey:
          type: string
          description: UUID v7 minted at outbox enqueue; the chain authority dedupes on this (ADR-0045).
    # Operator auth (T-015b).
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      # ADR-0047 §Decision: the PASETO token is set in an HttpOnly cookie, not
      # returned in this body. The body carries only the session expiry so the
      # SPA can render time-to-expiry without reading cookies (HttpOnly hides
      # the session cookie's value, and the csrf cookie isn't the expiry source
      # of truth).
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the session cookie expires (RFC3339 UTC).
    Identity:
      type: object
      required: [subject, edge]
      properties:
        subject:
          type: string
        edge:
          type: string
        deploymentProfile:
          type: string
          description: >-
            The active AIREOS_DEPLOYMENT_PROFILE (lan-only / vpn-first / dmz-first), echoed
            verbatim from installer configuration; unknown when the stack was not installed
            through install.sh. A read-only installation property — it carries no audit event
            (ADR-0068 §D2).
        scope:
          type: string
          description: >-
            The current session's named, versioned scope (ADR-0068 §D5) — e.g. approvals@1
            for a paired device session. A scope is a narrowing WITHIN the human-agent edge,
            never a separate edge. Absent entirely for an ordinary desktop session — api
            omits the field rather than sending an invented empty value (T-115b).
    # --- pairing (T-114a, ADR-0068 §D4-§D6/§D11) -------------------------------
    # New named schemas ONLY — none of these extend Grant, Workstream, the
    # shared page-envelope schema, or any other existing component (CON-3/CON-4).
    PairingRequestCreate:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: Operator-chosen name for the resulting session (never set by the redeeming device — ADR-0068 §D6).
    PairingRequestCreated:
      type: object
      required: [id, expiresAt, secret]
      properties:
        id:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: The 120-second pairing window (ADR-0068 §D6).
        secret:
          type: string
          description: >-
            The one-time plaintext secret. Present in a response body ONLY
            here — only its hash is ever persisted, and no other pairing
            response (redeem, list, revoke) ever carries it or the stored
            hash.
    PairingRedeemRequest:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret:
          type: string
          description: The plaintext secret carried by the QR's URL fragment (never sent as a query param or logged — ADR-0068 §D6).
    PairingRedeemResponse:
      type: object
      required: [expiresAt]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: When the new paired session's cookie expires (RFC3339 UTC) — mirrors LoginResponse; the token itself stays opaque to JS.
    PairedSession:
      type: object
      required: [id, scope, expiresAt, createdAt]
      properties:
        id:
          type: string
          description: The session id (= the minted token's jti); needed so the desk can name a session to revoke.
        label:
          type: string
        scope:
          type: string
          description: Always approvals@1 at v0.12 (ADR-0068 §D5) — a versioned, single-sourced scope within the human-agent edge, never a new capability edge.
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          description: Absent/null while the session is live.
        createdAt:
          type: string
          format: date-time
    PairingSessionsPage:
      type: object
      properties:
        nextCursor:
          type: string
        total:
          type: integer
    # --- policy rules (T-151b, ADR-0074; CON-2's rule vocabulary) --------------
    # Mirrors policy-service's policy_rules row (T-148/T-151a). subject/edge/
    # action/target are deliberately plain strings, not enums: a rule tuple
    # field is either an exact value or the literal wildcard "*" (CON-2), and
    # the store itself (services/policy-service/internal/store/rules.go)
    # enforces only non-emptiness in Go, not a closed vocabulary — an enum
    # here would silently diverge from what the store actually accepts.
    PolicyRule:
      type: object
      required: [id, label, subject, edge, action, target, outcome, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
        label:
          type: string
        subject:
          type: string
          description: The rule's MATCH subject — which agent the rule applies to. Not the rule's author (SEC-53/AUD-40 track authorship separately).
        edge:
          type: string
        action:
          type: string
        target:
          type: string
        outcome:
          type: string
          enum: [allow, requires_approval, deny]
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    # Create body for POST /v1/policy-rules. additionalProperties:false rejects
    # a client-supplied id/enabled/createdAt/updatedAt with 400 — id is
    # server-assigned and a new rule is always created enabled (T-151a's
    # CreateRuleInput contract; callers wanting a disabled rule PATCH it after
    # create).
    PolicyRuleInput:
      type: object
      additionalProperties: false
      required: [label, subject, edge, action, target, outcome]
      properties:
        label:
          type: string
        subject:
          type: string
        edge:
          type: string
        action:
          type: string
        target:
          type: string
        outcome:
          type: string
          enum: [allow, requires_approval, deny]
    # PATCH body for /v1/policy-rules/{id} — enabled is the only field this
    # route mutates (SEC-54).
    PolicyRulePatch:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
