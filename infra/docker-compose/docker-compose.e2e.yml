# AI Remote Engineering OS — live SSH end-to-end harness (T-020b).
#
# Brings up the FULL cockpit path on real wires — Postgres + audit-service +
# services/api + services/session-broker + a real openssh sshd target — plus a
# seed one-shot and a Go e2e test runner. Closes ADR-0045 §Verification item 3
# (the live producer→audit-chain proof) and is the G1 e2e proof for the SSH
# pillar (ai/war-room/activation-matrix.overlay.md).
#
#   task e2e                                            # up → seed → test → down
#   docker compose -f docker-compose.e2e.yml run --rm tester
#
# Auth posture: ONE cluster AIREOS_PASETO_KEY across api/broker/audit — REAL
# PASETO, deliberately NOT dev-insecure auth (an allow-all verifier would be a
# mock boundary, not a G1 proof) — plus a SEPARATE AIREOS_RESOURCE_SECRET_KEY
# for pgcrypto target-credential unwrap (authority separation, ADR-0048 §7).
#
# Every key/credential below is a throwaway TEST value. No secrets are
# committed to git: the SSH host + client keypairs are generated at runtime by
# the seed one-shot (tests/e2e/cmd/seed) and delivered on the sshd-keys volume.
# The operator password is "e2e-operator-pw"; the hash below is its argon2id
# digest (authctl hash). The sshd is a stand-in for an operator-provisioned
# target host, not a product component (ADR-0048 rejects guacd for terminal).

name: aireos-e2e

x-go: &go
  image: golang:1.26
  working_dir: /work
  volumes:
    - ../../:/work
    - gomodcache:/go/pkg/mod
    - gocache:/root/.cache/go-build

x-cluster-env: &cluster-env
  DATABASE_URL: postgres://cockpit:change-me@postgres:5432/cockpit?sslmode=disable
  AIREOS_PASETO_KEY: f458ffaa0fde38031a8b201166b9303603a07bd0c3c15b1174df0420bea6ca4f
  AIREOS_RESOURCE_SECRET_KEY: e2e-resource-secret-not-the-paseto-key

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot: run every service's migrations (api + audit + broker share one
  # Postgres DB with per-service migration tables, ADR-0044), generate the SSH
  # host + client keys onto the shared sshd-keys volume, and seed the ssh
  # resource (labels + pgp_sym_encrypt'd client key). Exits 0 when ready.
  seed:
    <<: *go
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *cluster-env
      SEED_KEY_DIR: /seed-keys
    volumes:
      - ../../:/work
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - sshd-keys:/seed-keys
    command:
      - bash
      - -c
      - |
        set -e
        go run ./services/api migrate up
        go run ./services/audit-service migrate up
        go run ./services/session-broker migrate up
        go run ./services/connector-service migrate up
        go run ./services/policy-service migrate up
        go run ./services/mcp-gateway migrate up
        go run ./tests/e2e/cmd/seed
        # Provision the credentials into connector custody via the real CLI (T-030b):
        # the broker leases them from connector at connect; nothing is stored in
        # resources.connection_secret. RIDs match tests/e2e/cmd/seed + harness_test.go;
        # the second resource is the requires_approval-flagged WD-2 target (T-033a).
        go run ./services/connector-service credentials set-secret \
          01900000-0000-7000-8000-0000000000e2 --key-file /seed-keys/client_ed25519
        go run ./services/connector-service credentials set-secret \
          01900000-0000-7000-8000-0000000000a2 --key-file /seed-keys/client_ed25519
        go run ./services/connector-service credentials set-secret \
          01900000-0000-7000-8000-0000000000d3 --key-file /seed-keys/client_ed25519
        go run ./services/connector-service credentials set-secret \
          01900000-0000-7000-8000-0000000000d4 --key-file /seed-keys/client_ed25519
        go run ./services/connector-service credentials set-secret \
          01900000-0000-7000-8000-0000000000d5 --key-file /seed-keys/client_ed25519
        go run ./services/connector-service credentials set-secret \
          01900000-0000-7000-8000-0000000000d6 --key-file /seed-keys/client_ed25519

  audit:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      AUDIT_ADDR: ":8081"
      # ADR-0060: accept the gateway's asymmetric outbox token (dual-mode alongside
      # the cluster key). Matches the gateway's AIREOS_GATEWAY_SIGN_KEY (set in T-049).
      AIREOS_GATEWAY_PUBLIC_KEY: baca828976826ae087bdfde41715192021ef1429cd95339b7678da4348dca652
      # ADR-0069 (T-124b): the chain-head signing key. Test fixture keypair generated via
      # `go run ./packages/go/auth/cmd/authctl genkeypair` — NEVER a real deployment key
      # (T-125 has install.sh mint a fresh one per install). Duplicated onto the tester
      # service below (same pattern as AIREOS_GATEWAY_SIGN_KEY) so the G1 live test can
      # derive the public half and call chain.VerifyHead against real signed heads.
      AIREOS_AUDIT_CHAIN_SIGN_KEY: 206f72f4093b3551d7819e7f0c212bda0e2c109983a2f315532e70d1e945ad80b4909c655f888fc007e84e775f75fedcdb234b3d8fb11d1e9b40620902571413
      # T-124b G1: lower the checkpoint cadence so a signed head appears within the live
      # e2e run instead of waiting for the 100-event/60s production defaults.
      AIREOS_AUDIT_CHECKPOINT_EVENTS: "20"
      AIREOS_AUDIT_CHECKPOINT_INTERVAL: "5s"
      # ADR-0069 D4 (T-125b): the out-of-Postgres anchor. On the named volume
      # below, deliberately OUTSIDE /work (the bind-mounted repo) — an anchor
      # file under /work would land in the git working tree and dirty it.
      AIREOS_AUDIT_ANCHOR_PATH: /var/lib/aireos/audit/chain-heads.ndjson
    volumes:
      - ../../:/work
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - auditanchor:/var/lib/aireos/audit
    command: ["bash", "-c", "go run ./services/audit-service serve"]

  api:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      # api no longer decrypts target credentials (T-030a) — empty the key to make
      # "only connector custodies the secret" explicit in the stack.
      AIREOS_RESOURCE_SECRET_KEY: ""
      API_ADDR: ":8080"
      # api's outbox relay delivers auth/control-plane events (T-022 / SEC-9).
      AIREOS_AUDIT_URL: http://audit:8081
      # api consults policy-service at session-create for requires_approval
      # resources and resolves operator approve/deny through it (ADR-0054, T-033a).
      POLICY_URL: http://policy:8084
      # api proxies the operator's pending-invocation list + approve/deny to the
      # gateway's internal plane (ADR-0057 §4, T-040b). Without this the operator
      # invocation routes answer 503.
      GATEWAY_URL: http://mcp-gateway:8085
      # ADR-0062 (T-065a): api verifies the gateway's v4.public token on the delegated-launch
      # forward with the gateway's PUBLIC key — route-scoped to /v1/internal/delegated-runs
      # (the operator routes stay symmetric-only, SEC-20). Matches the gateway's
      # AIREOS_GATEWAY_SIGN_KEY secret below (its public half).
      AIREOS_GATEWAY_PUBLIC_KEY: baca828976826ae087bdfde41715192021ef1429cd95339b7678da4348dca652
      # ADR-0060: api signs agent-tool tokens on the asymmetric agent plane with
      # this Ed25519 secret; the gateway verifies with the matching public key
      # (AIREOS_API_AGENT_PUBLIC_KEY). Test fixture keypair — NOT a real key.
      AIREOS_API_AGENT_SIGN_KEY: 3e95419281390e9902a82fa5284898eb727c94afecc91ce23cf2241f69ec07cf994aa3e0ebac212395d88900a2a8d2a793fe3b44c90c6dcb00148ecc9e3b5128
      AIREOS_BOOTSTRAP_OPERATOR_USER: admin
      AIREOS_BOOTSTRAP_OPERATOR_PASSWORD_HASH: "$$argon2id$$v=19$$m=65536,t=3,p=2$$c/1DjrxaiJU6wokhTzZpkQ$$Eb0SglfJ9v7PEDlVTyM48Sqeroyu3OFN5+7rl9wYdgI"
      # ADR-0063 (T-076): lower the workstream schedule floor so the WD-7 capstone proves
      # LIVE recurrence in seconds instead of the 60s production default. Only gates the
      # minimum interval a charter may request — no charter exists unless a WD-7 test makes
      # one, and each retires it, so the rest of the suite is unaffected.
      AIREOS_WORKSTREAM_MIN_INTERVAL_SECONDS: "5"
      # ADR-0064 (T-081/T-083): lower the memory expiry sweep cadence so the WD-8
      # capstone's expiry leg proves in seconds instead of the 2-minute production
      # default. e2e-only override — the installed stack keeps the default (OI-15).
      AIREOS_MEMORY_SWEEP_SECONDS: "2"
      # ADR-0066 (T-101): lower the context-index sweep cadence so the WD-10 capstone's
      # indexer/freshness/staleness legs prove in seconds instead of the 60s production
      # default (ctxindex.DefaultIndexInterval). e2e-only override — the installed stack
      # keeps the default (OI-17).
      AIREOS_CONTEXT_INDEX_SECONDS: "6"
      # E-03/OI-24 (ADR-0068 §D2): the compose stack is a loopback dev stack reached
      # directly, not through install.sh, so lan-only is the honest active profile.
      AIREOS_DEPLOYMENT_PROFILE: lan-only
      # E-02/T-115a: a TEST-STACK-ONLY override so the smoke suite's pairing spec
      # can exercise the real routes. install.sh's shipped default (SEC-41, off)
      # is untouched by this — this env var only reaches the api process inside
      # this compose file, never the installed stack.
      AIREOS_PAIRING_ENABLED: "1"
    command: ["bash", "-c", "go run ./services/api serve"]

  # connector-service: sole credential custodian + egress chokepoint (ADR-0053).
  # Holds AIREOS_RESOURCE_SECRET_KEY and decrypts on the lease; its egress relay
  # delivers credential.leased to audit (AIREOS_AUDIT_URL). The broker leases the
  # SSH key from here at connect — the broker itself runs with NO resource key.
  connector:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      CONNECTOR_ADDR: ":8083"
      AIREOS_AUDIT_URL: http://audit:8081
    command: ["bash", "-c", "go run ./services/connector-service serve"]

  broker:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      # SEC-13 runtime proof (T-030b): the broker holds NO resource secret key — it
      # leases the decrypted credential from connector-service. Override the shared
      # anchor's key to empty; the session must still work.
      AIREOS_RESOURCE_SECRET_KEY: ""
      CONNECTOR_URL: http://connector:8083
      BROKER_ADDR: ":8082"
      AIREOS_AUDIT_URL: http://audit:8081
      # ADR-0060: the exec-plane verifier also accepts the gateway's asymmetric token
      # (dual-mode). Matches the gateway's AIREOS_GATEWAY_SIGN_KEY (set in T-049).
      AIREOS_GATEWAY_PUBLIC_KEY: baca828976826ae087bdfde41715192021ef1429cd95339b7678da4348dca652
      AIREOS_CAST_DIR: /var/lib/aireos/sessions
    volumes:
      - ../../:/work
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - casts:/var/lib/aireos/sessions
    command: ["bash", "-c", "go run ./services/session-broker serve"]

  # policy-service: the approval/policy decision point (ADR-0054, T-033a). api
  # Decides at session-create for requires_approval resources and Resolves the
  # operator's approve/deny through it (both INTERNAL service-service RPCs, real
  # PASETO audience policy-service); its in-process outbox relay delivers
  # policy.decision / approval.* to audit — the WD-2 chain events.
  policy:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      POLICY_ADDR: ":8084"
      AIREOS_AUDIT_URL: http://audit:8081
      # ADR-0060: accept the gateway's asymmetric Decide token (dual-mode alongside
      # api's symmetric token). Matches the gateway's AIREOS_GATEWAY_SIGN_KEY (T-049).
      AIREOS_GATEWAY_PUBLIC_KEY: baca828976826ae087bdfde41715192021ef1429cd95339b7678da4348dca652
    command: ["bash", "-c", "go run ./services/policy-service serve"]

  # mcp-gateway: the Typed MCP Gateway (ADR-0056/0057), the first agent surface +
  # the v0.3.0 spine's orchestrator (T-039). It verifies agent-tool tokens
  # (audience mcp-gateway), reads requires_approval from resources.labels, consults
  # policy, leases-via-broker the governed exec, and audits tool.invoked/tool.result.
  # The gateway holds NO resource secret key (SEC-13/17). The invocations schema is
  # migrated by the seed one-shot above (mcp-gateway migrate up).
  mcp-gateway:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      # ADR-0060 (T-049): the agent-facing gateway is KEYLESS of the cluster (SEC-20).
      # Override the shared anchor's symmetric key to empty: the gateway signs its
      # outbound (→ policy/broker/audit) with its OWN asymmetric key and verifies all
      # inbound with api's public key — it can no longer mint any cluster token.
      AIREOS_PASETO_KEY: ""
      AIREOS_GATEWAY_SIGN_KEY: 77c62aa6ab782391dfbb81a9a58d3e6b3b78506f4b9e37d1fe7d91456ea87b21baca828976826ae087bdfde41715192021ef1429cd95339b7678da4348dca652
      # F3 (ADR-0059): encrypt the persisted invocation command at rest (AES-256-GCM,
      # 32-byte key) — distinct from the sign key above. Test fixture, NOT a real key.
      AIREOS_GATEWAY_COMMAND_KEY: 91d5921441d28c802d5578074e108cc5b0180673ba79b94a101f24637ed5a80a
      MCP_ADDR: ":8085"
      AIREOS_AUDIT_URL: http://audit:8081
      POLICY_URL: http://policy:8084
      BROKER_URL: http://broker:8082
      # ADR-0062 (T-065b): the gateway forwards an agent's run.launch to api's internal
      # delegated-launch route, signed with the gateway's own asymmetric service token.
      API_URL: http://api:8080
      # ADR-0060: the gateway also verifies api's asymmetric agent-tool tokens with
      # api's PUBLIC key (dual-mode alongside the cluster key). Matches the secret
      # in api's AIREOS_API_AGENT_SIGN_KEY above.
      AIREOS_API_AGENT_PUBLIC_KEY: 994aa3e0ebac212395d88900a2a8d2a793fe3b44c90c6dcb00148ecc9e3b5128
    command: ["bash", "-c", "go run ./services/mcp-gateway serve"]

  sshd:
    build:
      context: ./e2e
      dockerfile: Dockerfile.sshd
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - sshd-keys:/seed-keys:ro

  # The G1 proof. Profile-gated so it only runs on `compose run tester`, not on
  # a plain `up`. Drives the live walkthrough and asserts the audit chain; reads
  # cast files off the shared volume and mints its audit-read token from the
  # same cluster PASETO key. Its exit status is the harness's verdict.
  tester:
    <<: *go
    profiles: ["test"]
    depends_on:
      - api
      - broker
      - connector
      - policy
      - audit
      - mcp-gateway
      - sshd
    environment:
      <<: *cluster-env
      AIREOS_CAST_DIR: /var/lib/aireos/sessions
      E2E_API_URL: http://api:8080
      E2E_BROKER_WS: ws://broker:8082
      E2E_AUDIT_URL: http://audit:8081
      E2E_MCP_URL: http://mcp-gateway:8085
      E2E_CONNECTOR_URL: http://connector:8083
      # SEC-21 negative test (WD-4): the tester forges a token with the gateway's OWN
      # signing key and proves connector/api reject it. Same fixture as the gateway's
      # AIREOS_GATEWAY_SIGN_KEY (the tester already holds the more-powerful cluster key).
      AIREOS_GATEWAY_SIGN_KEY: 77c62aa6ab782391dfbb81a9a58d3e6b3b78506f4b9e37d1fe7d91456ea87b21baca828976826ae087bdfde41715192021ef1429cd95339b7678da4348dca652
      # T-124b G1: same fixture keypair as audit's AIREOS_AUDIT_CHAIN_SIGN_KEY above —
      # the tester derives the public half from this secret to call chain.VerifyHead
      # against heads the live audit-service actually signed.
      AIREOS_AUDIT_CHAIN_SIGN_KEY: 206f72f4093b3551d7819e7f0c212bda0e2c109983a2f315532e70d1e945ad80b4909c655f888fc007e84e775f75fedcdb234b3d8fb11d1e9b40620902571413
      # ADR-0069 D4 (T-125b): same path as the audit service's
      # AIREOS_AUDIT_ANCHOR_PATH, on the SAME named volume (below) — the G1
      # extension reads this file directly to prove the live audit-service's
      # anchor writes agree with its DB-signed heads.
      AIREOS_AUDIT_ANCHOR_PATH: /var/lib/aireos/audit/chain-heads.ndjson
    volumes:
      - ../../:/work
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - casts:/var/lib/aireos/sessions
      - auditanchor:/var/lib/aireos/audit
    # After the e2e tests pass: run the T-124b G1 live chain-head-sweep proof (it lives
    # under services/audit-service, not tests/e2e — that is a SEPARATE Go module and
    # Go's internal-package rule forbids it from importing internal/chain at all; see
    # checkpoint_e2e_test.go's header comment), THEN force one last checkpoint (the
    # `checkpoint` subcommand — ADR-0069 D3's explicit operator action, bypasses the
    # cadence gate) so the tail of events the suite just generated since the audit
    # service's last periodic sweep tick is actually signed, THEN verify the WHOLE
    # accumulated audit chain's hash integrity (AUD-11) — recomputes every chainHash +
    # prevHash link AND (T-126a, ADR-0069 D6) every signed head's Ed25519 signature,
    # exits non-zero on a broken link or a bad/unrecognized head signature. `verify`
    # derives its public key from this service's own AIREOS_AUDIT_CHAIN_SIGN_KEY above
    # (no separate AIREOS_AUDIT_CHAIN_PUBLIC_KEY needed — see resolveVerifyKey's doc
    # comment), so the G1 assertion below is deliberately stronger than "exit 0": it
    # greps stdout for the literal INTACT+ATTESTED outcome — task e2e's trailing verify
    # run must never quietly regress to INTACT+UNATTESTED (head signing silently not
    # exercised) or the ordering-only fallback (no key at all) and still pass. Retried a
    # few times (1s apart) purely to absorb the checkpoint's own non-blocking advisory
    # lock losing a race against the audit service's own concurrent cadence tick — not a
    # flake worked around, since a losing tester-side checkpoint means the OTHER side
    # already signed the identical tip and the very next verify attempt sees it.
    #
    # FINALLY (T-127b, SEC-43/VER-16): run the forged-chain negative proof as its OWN,
    # EXPLICITLY-SEQUENCED LAST STEP — never folded into the untagged step above by
    # naming convention alone (one future added test away from an order-dependent,
    # hard-to-debug failure against a chain that step destroys). It requires BOTH the
    # "e2e" and "sec43" build tags AND an explicit -run — see sec43_e2e_test.go's header
    # comment for why the tag is stacked rather than reused. It disables
    # audit_events_no_mutate on THIS disposable stack only (never the migration),
    # tampers one event below the last signed head, repairs the chain around it with
    # chain.Compute so plain chain.Verify reports intact, then proves BOTH the DB-backed
    # `audit-service verify` and the offline third-party `aireos-verify` binary still
    # catch it — each shown passing on the clean chain first (VER-16), then failing
    # correctly on the forged one. Runs LAST because it leaves the chain unusable for
    # anything after it.
    command: ["bash", "-c", "set -o pipefail; go test -tags e2e -count=1 -v -timeout 600s ./tests/e2e/... && go test -tags e2e -count=1 -v -timeout 120s ./services/audit-service/internal/checkpoint/... && { ok=0; for i in 1 2 3 4 5; do go run ./services/audit-service checkpoint; if go run ./services/audit-service verify | tee /dev/stderr | grep -q 'INTACT+ATTESTED'; then ok=1; break; fi; sleep 1; done; if [ \"$$ok\" != 1 ]; then echo 'G1 FAILED: audit-service verify never reported INTACT+ATTESTED after 5 forced-checkpoint retries' >&2; exit 1; fi; }  && go test -tags e2e,sec43 -run '^TestSEC43ForgedAuditChainCaughtByBothVerifiers$' -count=1 -v -timeout 180s ./services/audit-service/internal/checkpoint/..."]

volumes:
  gomodcache:
  gocache:
  casts:
  sshd-keys:
  # ADR-0069 D4 (T-125b): the out-of-Postgres anchor file. A named volume,
  # deliberately NOT under the ../../:/work bind mount — an anchor file
  # written into the repo's working tree would dirty `git status` on every
  # e2e run. Shared read/write by audit and tester (the G1 assertion).
  auditanchor:
