# AI Remote Engineering OS — live SSH end-to-end harness (T-020b).
#
# Brings up the FULL cockpit path on real wires — Postgres + audit-service +
# services/api + services/session-broker + a real openssh sshd target — plus a
# seed one-shot and a Go e2e test runner. Closes ADR-0045 §Verification item 3
# (the live producer→audit-chain proof) and is the G1 e2e proof for the SSH
# pillar (ai/war-room/activation-matrix.overlay.md).
#
#   task e2e                                            # up → seed → test → down
#   docker compose -f docker-compose.e2e.yml run --rm tester
#
# Auth posture: ONE cluster AIREOS_PASETO_KEY across api/broker/audit — REAL
# PASETO, deliberately NOT dev-insecure auth (an allow-all verifier would be a
# mock boundary, not a G1 proof) — plus a SEPARATE AIREOS_RESOURCE_SECRET_KEY
# for pgcrypto target-credential unwrap (authority separation, ADR-0048 §7).
#
# Every key/credential below is a throwaway TEST value. No secrets are
# committed to git: the SSH host + client keypairs are generated at runtime by
# the seed one-shot (tests/e2e/cmd/seed) and delivered on the sshd-keys volume.
# The operator password is "e2e-operator-pw"; the hash below is its argon2id
# digest (authctl hash). The sshd is a stand-in for an operator-provisioned
# target host, not a product component (ADR-0048 rejects guacd for terminal).

name: aireos-e2e

x-go: &go
  image: golang:1.23
  working_dir: /work
  volumes:
    - ../../:/work
    - gomodcache:/go/pkg/mod
    - gocache:/root/.cache/go-build

x-cluster-env: &cluster-env
  DATABASE_URL: postgres://cockpit:change-me@postgres:5432/cockpit?sslmode=disable
  AIREOS_PASETO_KEY: f458ffaa0fde38031a8b201166b9303603a07bd0c3c15b1174df0420bea6ca4f
  AIREOS_RESOURCE_SECRET_KEY: e2e-resource-secret-not-the-paseto-key

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 3s
      timeout: 5s
      retries: 30

  # One-shot: run every service's migrations (api + audit + broker share one
  # Postgres DB with per-service migration tables, ADR-0044), generate the SSH
  # host + client keys onto the shared sshd-keys volume, and seed the ssh
  # resource (labels + pgp_sym_encrypt'd client key). Exits 0 when ready.
  seed:
    <<: *go
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *cluster-env
      SEED_KEY_DIR: /seed-keys
    volumes:
      - ../../:/work
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - sshd-keys:/seed-keys
    command:
      - bash
      - -c
      - |
        set -e
        go run ./services/api migrate up
        go run ./services/audit-service migrate up
        go run ./services/session-broker migrate up
        go run ./services/connector-service migrate up
        go run ./services/policy-service migrate up
        go run ./services/mcp-gateway migrate up
        go run ./tests/e2e/cmd/seed
        # Provision the credentials into connector custody via the real CLI (T-030b):
        # the broker leases them from connector at connect; nothing is stored in
        # resources.connection_secret. RIDs match tests/e2e/cmd/seed + harness_test.go;
        # the second resource is the requires_approval-flagged WD-2 target (T-033a).
        go run ./services/connector-service credentials set-secret \
          01900000-0000-7000-8000-0000000000e2 --key-file /seed-keys/client_ed25519
        go run ./services/connector-service credentials set-secret \
          01900000-0000-7000-8000-0000000000a2 --key-file /seed-keys/client_ed25519

  audit:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      AUDIT_ADDR: ":8081"
    command: ["bash", "-c", "go run ./services/audit-service serve"]

  api:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      # api no longer decrypts target credentials (T-030a) — empty the key to make
      # "only connector custodies the secret" explicit in the stack.
      AIREOS_RESOURCE_SECRET_KEY: ""
      API_ADDR: ":8080"
      # api's outbox relay delivers auth/control-plane events (T-022 / SEC-9).
      AIREOS_AUDIT_URL: http://audit:8081
      # api consults policy-service at session-create for requires_approval
      # resources and resolves operator approve/deny through it (ADR-0054, T-033a).
      POLICY_URL: http://policy:8084
      AIREOS_BOOTSTRAP_OPERATOR_USER: admin
      AIREOS_BOOTSTRAP_OPERATOR_PASSWORD_HASH: "$$argon2id$$v=19$$m=65536,t=3,p=2$$c/1DjrxaiJU6wokhTzZpkQ$$Eb0SglfJ9v7PEDlVTyM48Sqeroyu3OFN5+7rl9wYdgI"
    command: ["bash", "-c", "go run ./services/api serve"]

  # connector-service: sole credential custodian + egress chokepoint (ADR-0053).
  # Holds AIREOS_RESOURCE_SECRET_KEY and decrypts on the lease; its egress relay
  # delivers credential.leased to audit (AIREOS_AUDIT_URL). The broker leases the
  # SSH key from here at connect — the broker itself runs with NO resource key.
  connector:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      CONNECTOR_ADDR: ":8083"
      AIREOS_AUDIT_URL: http://audit:8081
    command: ["bash", "-c", "go run ./services/connector-service serve"]

  broker:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      # SEC-13 runtime proof (T-030b): the broker holds NO resource secret key — it
      # leases the decrypted credential from connector-service. Override the shared
      # anchor's key to empty; the session must still work.
      AIREOS_RESOURCE_SECRET_KEY: ""
      CONNECTOR_URL: http://connector:8083
      BROKER_ADDR: ":8082"
      AIREOS_AUDIT_URL: http://audit:8081
      AIREOS_CAST_DIR: /var/lib/aireos/sessions
    volumes:
      - ../../:/work
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - casts:/var/lib/aireos/sessions
    command: ["bash", "-c", "go run ./services/session-broker serve"]

  # policy-service: the approval/policy decision point (ADR-0054, T-033a). api
  # Decides at session-create for requires_approval resources and Resolves the
  # operator's approve/deny through it (both INTERNAL service-service RPCs, real
  # PASETO audience policy-service); its in-process outbox relay delivers
  # policy.decision / approval.* to audit — the WD-2 chain events.
  policy:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      POLICY_ADDR: ":8084"
      AIREOS_AUDIT_URL: http://audit:8081
    command: ["bash", "-c", "go run ./services/policy-service serve"]

  # mcp-gateway: the Typed MCP Gateway (ADR-0056/0057), the first agent surface +
  # the v0.3.0 spine's orchestrator (T-039). It verifies agent-tool tokens
  # (audience mcp-gateway), reads requires_approval from resources.labels, consults
  # policy, leases-via-broker the governed exec, and audits tool.invoked/tool.result.
  # The gateway holds NO resource secret key (SEC-13/17). The invocations schema is
  # migrated by the seed one-shot above (mcp-gateway migrate up).
  mcp-gateway:
    <<: *go
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *cluster-env
      MCP_ADDR: ":8085"
      AIREOS_AUDIT_URL: http://audit:8081
      POLICY_URL: http://policy:8084
      BROKER_URL: http://broker:8082
    command: ["bash", "-c", "go run ./services/mcp-gateway serve"]

  sshd:
    build:
      context: ./e2e
      dockerfile: Dockerfile.sshd
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - sshd-keys:/seed-keys:ro

  # The G1 proof. Profile-gated so it only runs on `compose run tester`, not on
  # a plain `up`. Drives the live walkthrough and asserts the audit chain; reads
  # cast files off the shared volume and mints its audit-read token from the
  # same cluster PASETO key. Its exit status is the harness's verdict.
  tester:
    <<: *go
    profiles: ["test"]
    depends_on:
      - api
      - broker
      - connector
      - policy
      - audit
      - mcp-gateway
      - sshd
    environment:
      <<: *cluster-env
      AIREOS_CAST_DIR: /var/lib/aireos/sessions
      E2E_API_URL: http://api:8080
      E2E_BROKER_WS: ws://broker:8082
      E2E_AUDIT_URL: http://audit:8081
      E2E_MCP_URL: http://mcp-gateway:8085
    volumes:
      - ../../:/work
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - casts:/var/lib/aireos/sessions
    command: ["bash", "-c", "go test -tags e2e -count=1 -v -timeout 300s ./tests/e2e/..."]

volumes:
  gomodcache:
  gocache:
  casts:
  sshd-keys:
