# oapi-codegen config for services/api — ADR-0043 (chi-server), T-005b.
#
# Per-service slicing via include-tags: [resources] generates only the resource
# registry surface from the canonical contract. Same pattern as
# oapi-codegen.audit.yaml (T-014); each service gets its own config.
#
# models: true is required (chi-server references generated param/error types).
# As in audit-service, the generated body models are not used by the handlers —
# bodies are the internal/resource domain types (the store carries created_at /
# updated_at not on the wire). The load-bearing artifact is the ServerInterface.
package: server
output: services/api/internal/server/gen.go
generate:
  chi-server: true
  models: true
output-options:
  include-tags:
    - resources
    - auth
    - sessions
    - audit-read
    - runs
    - grants
    - workstreams
    - memories
    - context-sources
    - pairing
    - policy-rules
