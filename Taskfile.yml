# Taskfile for AI Remote Engineering OS — ADR-0042.
#
# Canonical entry points (ADR-0042 §Decision):
#   task lint           — code/style/dep checks across Go + TS
#   task test           — unit/integration tests across Go + TS
#   task build          — produce per-service Go binaries + apps/* dist
#   task offline-bundle — populate Go module cache + pnpm content store
#                          for restricted-network install
#
# Targets named by follow-up ADRs land with the tickets that need them:
#   task codegen        — oapi-codegen + openapi-typescript (ADR-0043 / ADR-0047)
#   task migrate        — per-service migrate subcommand    (ADR-0044)
#   task auth rotate-key — packages/go/auth key rotation     (ADR-0046)
#   task outbox         — relay subcommand                    (ADR-0045)
#
# The four canonical entry points are stubbed below to exit 0 with a
# "not-yet-implemented" banner so dormant verification tickets (T-011,
# T-012) can extend them without their "passes on main" criterion
# failing today.

version: '3'

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task -l
    silent: true

  lint:
    desc: "Run all linters. JS-side T-012 + Go-side T-011 close v0.1.0 SEC-7 + SEC-8 release-blockers."
    vars:
      # v2 line (T-146/VER-25): v1.x does not compile under a Go 1.26
      # builder (vendored x/tools failure). `.golangci.yaml` was migrated
      # to the v2 schema in the same ticket -- see its header comment.
      GOLANGCI_LINT: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0
    cmds:
      # === JS side (T-012) ===
      - pnpm -r --if-present run lint
      - node tools/forbidden-deps.mjs
      # === Go side (T-011) ===
      # golangci-lint via go run keeps the binary out of the host
      # toolchain (offline-install posture; ADR-0042 "smallest viable
      # tooling kit"). First run downloads + caches; subsequent runs
      # are fast (gomodcache volume). --timeout: v2 dropped run.timeout
      # from the config file (disabled by default), so the 5m bound that
      # used to live in .golangci.yaml is passed here instead.
      - |
        for mod in packages/go/auth packages/go/middleware packages/go/migrate services/api services/audit-service services/connector-service services/mcp-gateway services/policy-service services/session-broker tools/migrate-lint tools/forbidden-features-check; do
          (cd "$mod" && go run {{.GOLANGCI_LINT}} run ./... --timeout 5m --config "$(git rev-parse --show-toplevel)/.golangci.yaml")
        done
      - go run ./tools/migrate-lint services/audit-service/migrations
      - go run ./tools/forbidden-features-check .

  test:
    desc: Run all tests (extended by per-service tickets).
    cmds:
      # audit-service + shared packages (T-004b). Unit tests run here; the
      # store integration tests are tagged `integration` and need a Postgres
      # (see task test-integration).
      # Explicit per-module patterns: a bare ./... or ./packages/go/... does not
      # resolve from the workspace root (the modules live one level deeper).
      - go test ./packages/go/auth/... ./packages/go/middleware/... ./packages/go/migrate/... ./services/api/... ./services/audit-service/... ./services/connector-service/... ./services/mcp-gateway/... ./services/policy-service/... ./services/session-broker/...
      # install.sh deployment-profile helpers (T-112a, OI-22's named live test).
      # bash-only (no python3/go needed); needs bash, so run in golang:1.26 on
      # the offline-only dev box (node:22-alpine has no bash).
      - bash infra/offline/install_profile_test.sh
      # setup-loopback-demo.sh's pure helpers (T-118b, ONB-3/ONB-4's named live
      # test for the authorized_keys line construction — F4 from the E-04
      # reconciliation pass: nothing else exercises this script automatically).
      - bash infra/offline/setup_loopback_demo_test.sh
      # install.sh's audit chain-head signing key (T-125a, OI-41's named live
      # test): unlike the two tests above, this one runs install.sh's REAL
      # body (root, useradd, chown) to prove byte-identical key reuse across a
      # re-install — a claim a pure-function test can't make. SKIPS (does not
      # fail) when not running as root, e.g. a bare non-container dev machine;
      # it must be run inside golang:1.26 (or another root container) to
      # actually exercise the assertion. See the script's own header.
      - bash infra/offline/install_audit_key_test.sh
      # JS workspace unit tests (T-007a). `--if-present` skips packages
      # without a `test` script; packages/ui + packages/config have none yet.
      - pnpm -r --if-present run test

  test-integration:
    desc: "Run DB-backed integration tests (needs Postgres; set AUDIT_/CONNECTOR_/POLICY_/MCP_/API_TEST_DATABASE_URL). ADR-0045 chain-integrity + dedup; ADR-0053 connector credential custody; ADR-0057 gateway invocations. Tests self-skip when their env var is unset."
    cmds:
      # api's own -tags integration suites (grant/memory/run/workstream/ctxindex/store/
      # pairing) were never listed here before T-113 — this line is what actually runs
      # them; needs API_TEST_DATABASE_URL against a DB with api's migrations applied.
      - go test -tags integration ./services/api/internal/...
      - go test -tags integration ./services/audit-service/internal/store/...
      # connector-service credential custody (ADR-0053; needs CONNECTOR_TEST_DATABASE_URL
      # against a DB with both api + connector migrations applied).
      - go test -tags integration ./services/connector-service/internal/store/...
      # policy-service pending-approvals store (ADR-0054; needs POLICY_TEST_DATABASE_URL
      # against a DB with the policy migration applied).
      - go test -tags integration ./services/policy-service/internal/store/...
      # mcp-gateway invocations store (ADR-0057; needs MCP_TEST_DATABASE_URL against a
      # DB with the gateway migration applied).
      - go test -tags integration ./services/mcp-gateway/internal/store/...

  validate:
    desc: "Validate the OpenAPI fragment + JSON Schema fixtures (T-010). Needs python3 + jsonschema + pyyaml."
    cmds:
      - python3 infra/scripts/validate_contracts.py

  build:
    desc: Build all Go services and apps/* (extended by per-service tickets).
    cmds:
      - go build -o bin/audit-service ./services/audit-service
      - go build -o bin/api ./services/api
      - go build -o bin/connector-service ./services/connector-service
      - go build -o bin/mcp-gateway ./services/mcp-gateway
      - go build -o bin/policy-service ./services/policy-service
      - go build -o bin/session-broker ./services/session-broker

  offline-bundle:
    desc: "Build the offline-install bundle (§OI-a, ADR-0051): static linux/amd64 service binaries + SPA + Caddy + config + SHA256 manifest + CycloneDX 1.6 SBOM (ADR-0070 D5, T-129b), packaged + OI-4 size-gated. Output: dist/offline/. Build host needs go 1.23 + node 22/pnpm + curl|wget. install.sh + staged postgres packages land in §OI-b."
    vars:
      # The Taskfile is the single source of truth for the release artifact's
      # version (T-122a, OI-29): build-bundle.sh REFUSES to run without
      # BUNDLE_VERSION set (no silent default — the OI-21 rule), and this is
      # the one place that sets it. Bump on every release.
      BUNDLE_VERSION: "0.14.0"
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm --filter @aireos/web build
      - BUNDLE_VERSION={{.BUNDLE_VERSION}} bash infra/offline/build-bundle.sh

  sign-release:
    desc: "HOST-SIDE, out-of-band step (ADR-0070 D1/D3, T-129a): detached Ed25519 signatures over BOTH shipped offline artifacts (core bundle + postgres companion). NEVER run inside build-bundle.sh or any build container — the release key must never enter a build context. Usage: task sign-release -- --key /path/to/release-key.pem [artifact.tar.gz ...] (defaults to every dist/offline/*.tar.gz). The production key is minted out-of-band by the CEO and is NEVER created by this task — see docs/devops/offline-install-v3.md 'Release key custody'; a fixture key for tests lives at infra/offline/testdata/fixture-release-key/. NOTE: this task signs whatever artifact filename/VERSION is on disk — offline-bundle's BUNDLE_VERSION was bumped to 0.13.0 on 2026-08-18 (moved earlier than its original T-136 slot, because T-133's quickstart gate consumes the built bundle); still verify the artifact name matches the real release before signing for an actual release."
    cmds:
      - bash infra/offline/sign-release.sh {{.CLI_ARGS}}

  provenance-check:
    desc: "Release provenance gate (ADR-0070 D9, VER-11, T-129a + T-129b): every dist/offline/*.tar.gz must carry a detached Ed25519 .sig verifying against RELEASE_PUBLIC_KEY, AND a sibling CycloneDX SBOM whose coverage is checked against the artifact's actual contents (not just presence — see infra/offline/sbom/check-coverage.mjs). Self-skips (loud) when nothing has been built yet; a missing/invalid signature, missing SBOM, or SBOM coverage gap on an artifact that DOES exist is a hard failure, never silently skipped (the S-25 pattern this gate exists to avoid). Needs node in addition to openssl. Usage: RELEASE_PUBLIC_KEY=/path/to/aireos-release.pub task provenance-check."
    cmds:
      - bash infra/offline/check-provenance.sh

  sec45-check:
    desc: "SEC-45 negative proof (ADR-0070 D1/D2/D9, VER-16, T-130a): mutates ONE byte in a scratch COPY of EVERY already-built+signed dist/offline/*.tar.gz (the artifact list is globbed, never hardcoded — so a second per-OS postgres companion is covered automatically rather than shipping signed but unproven; dist/offline/ itself is never touched) and asserts signature verification fails on that copy — both via raw openssl AND via check-provenance.sh naming the artifact in a 'signature does NOT verify' line — while a control pass on the unmutated copy is proven to verify clean first, on the same code path. The closing line names every artifact actually covered, and says PROVED only on a clean run. A deliberately-invoked release-evidence step, NOT part of the dev-loop release-check gate (not wired into `task release-check`) — it needs the real signed artifacts already on disk, which a dev loop rarely has, and dies loudly rather than self-skipping if they are missing (a negative proof must never graft on a dev-loop self-skip). Verifies against RELEASE_PUBLIC_KEY when set (the same variable provenance-check reads), else the test fixture at infra/offline/testdata/fixture-release-key/ — so the real release key can be used at T-136. Needs node in addition to openssl. Usage: task sec45-check (after `task offline-bundle` + `task sign-release -- --key <fixture-or-real-key>`)."
    cmds:
      - bash infra/offline/sec45_bundle_mutation_test.sh

  measure-reproducibility:
    desc: "OI-35/VER-6 (ADR-0070 D6/D7, T-130b): build the offline bundle TWICE from the CURRENT commit -- re-running the SPA build from scratch each time -- and diff both the tarball and the unpacked stage, attributed per layer (bin/*, web/, SBOM.cdx.json, SHA256_MANIFEST.txt, VERSION, config/, install.sh, setup-loopback-demo.sh). Non-reproducibility is a published FINDING, not a blocker (D7) -- the result is reported either way. Refuses on a dirty tree (a dirty tree flips vcs.modified between builds, making the measurement meaningless). Needs Docker (builds/reuses a local golang:1.26+node image) and the host's pnpm. NEVER writes into dist/offline/ -- uses scratch OUT_DIRs and asserts dist/offline is byte-unchanged on exit. See docs/releases/v0.13.0/reproducibility-report.md for the last published result."
    cmds:
      - bash infra/offline/measure-reproducibility.sh

  codegen:
    desc: "Generate per-service Go chi-server stubs + apps/web TS types from the OpenAPI fragment (ADR-0043, ADR-0047; T-014, T-007a). One schema, two consumers."
    vars:
      OAPI_CODEGEN: github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
    cmds:
      # One Go config per service (include-tags slices the canonical contract).
      - go run {{.OAPI_CODEGEN}} --config oapi-codegen.audit.yaml docs/api-contracts/openapi.v3.fragment.yaml
      - go run {{.OAPI_CODEGEN}} --config oapi-codegen.api.yaml docs/api-contracts/openapi.v3.fragment.yaml
      # TS types + openapi-fetch client for the SPA (ADR-0047, T-007a). Same
      # fragment, third consumer. Requires `pnpm install` to have hydrated the
      # workspace; see .github/workflows/ci.yml `js` job for the install loop.
      - pnpm --filter @aireos/shared-types run codegen

  migrate:
    desc: "Run a service's embedded migrations: task migrate -- <service> <up|version|force <v>> (ADR-0044)."
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        svc="$1"; shift
        go run ./services/"$svc" migrate "$@"

  auth:
    desc: "Auth provisioning (ADR-0046): task auth -- genkey | hash <password>. genkey prints a cluster PASETO key; hash prints an argon2id hash for the bootstrap operator."
    cmds:
      - go run ./packages/go/auth/cmd/authctl {{.CLI_ARGS}}

  connector:
    desc: "connector-service credential custody (ADR-0053; sole holder of AIREOS_RESOURCE_SECRET_KEY since T-030). task connector -- genkey | set-secret <id> --key-file <path> [--passphrase <pp>] | migrate-legacy. genkey prints a fresh AIREOS_RESOURCE_SECRET_KEY (no DB; relocated from `api resources genkey`); set-secret pgcrypto-encrypts target SSH credentials into connector custody; migrate-legacy backfills existing ciphertext off resources.connection_secret. Needs CONNECTOR_DATABASE_URL + AIREOS_RESOURCE_SECRET_KEY (genkey excepted)."
    cmds:
      - go run ./services/connector-service credentials {{.CLI_ARGS}}

  e2e:
    desc: "Live SSH end-to-end harness (T-020b): compose up postgres+api+broker+audit+a test sshd, seed keys+resource, run the tagged Go walkthrough, assert the LIVE audit chain (session.open + terminal.input.line + session.close w/ cast SHA). Closes ADR-0045 §Verification 3. On a Windows host, prefix the docker invocation with MSYS_NO_PATHCONV=1."
    dir: infra/docker-compose
    cmds:
      - docker compose -f docker-compose.e2e.yml build
      - defer: docker compose -f docker-compose.e2e.yml down -v
      - docker compose -f docker-compose.e2e.yml run --rm tester

  wd1:
    desc: "WD-1 installed-stack proof (T-021d, ADR-0051): bring up the REAL offline install under systemd-in-Docker + assert the stack is active + the chain-verify CLI (T-021d-a). The full WD-1 walkthrough is T-021d-b. Prereq: the core bundle + the ubuntu2404 postgres companion in dist/offline/ (build them first — see the script's error messages)."
    cmds:
      - bash infra/offline/wd1/run-wd1.sh

  smoke:
    desc: "Browser smoke suite (T-034): the headless §12 governed-egress walkthrough in a real Chromium against the BUILT apps/web bundle served same-origin behind Caddy, on the live e2e backend. Asserts the cockpit RENDERS (login → ApprovalPrompt → deny/approve → xterm output + the xterm.css regression guard → audit timeline). Complements `task e2e` (which owns the byte-exact live audit chain). Pulls the Playwright image — CI/full-env only, not the air-gapped box. On a Windows host, prefix with MSYS_NO_PATHCONV=1."
    dir: infra/docker-compose
    cmds:
      - docker compose -f docker-compose.smoke.yml build
      - defer: docker compose -f docker-compose.smoke.yml down -v
      - docker compose -f docker-compose.smoke.yml run --rm smoke

  doc-check:
    desc: "Assert every in-repo file path referenced in CANONICAL_SOURCE_OF_TRUTH.md + the ADRs resolves on disk (release-criteria DOC-1; §11a-1). Needs python3."
    cmds:
      - python3 infra/scripts/doc_check.py

  release-check:
    desc: "Release gate aggregator (release-criteria VER-3/VER-5; §11a-1): run every must-pass gate in sequence, exiting 0 only if all pass. Needs the full toolchain (go + node/pnpm + python3 + Docker for the e2e leg); the integration leg needs a Postgres (set AUDIT/CONNECTOR/POLICY_TEST_DATABASE_URL, else those tests self-skip). Intended for the CI host / a full dev env; the offline-only dev box runs the per-leg Docker commands."
    cmds:
      - task: doc-check
      - task: validate
      - task: lint
      - task: sec13-gate
      - task: licenses
      - task: test
      - task: test-integration
      - pnpm -r run typecheck
      - pnpm --filter @aireos/web run build
      # codegen drift (VER-2): regenerate, then assert the committed output matches.
      - task: codegen
      - cmd: git diff --exit-code
        # A non-empty diff after codegen means the committed generated files are
        # stale (run `task codegen` and commit). Assumes a clean working tree.
      # The WD-2 live e2e leg (VER-5/VER-6): the governed-egress wedge on real
      # wires — both walkthroughs (ungated + approval), no mocked boundary.
      - task: e2e
      # The browser smoke leg (T-034): the same wedge through the rendered cockpit
      # in a real browser — the machine version of the §12 human WD-2, asserting
      # the shipped bundle renders (incl. the xterm.css regression guard). Needs
      # the Playwright image; CI/full-env only, same posture as the e2e leg.
      - task: smoke
      # Release provenance (ADR-0070 D9, VER-11, T-129a + T-129b): fails if a
      # shipped dist/offline/*.tar.gz lacks a valid signature OR a coverage-
      # checked SBOM. Self-skips (loud) when no bundle has been built yet in
      # this run — see the task's own desc.
      - task: provenance-check
      # VER-21 / F-1 (closed at T-145): a green `task release-check` used to
      # mean EITHER "provenance was verified" OR "there was nothing to
      # verify" — the aggregate never said which. provenance-check's own
      # SKIP/DONE line is easy to lose in a long scrolling run, and this task
      # only reaches here at all when that leg already passed (a Task cmds
      # list stops at the first failure), so the two remaining outcomes are
      # exactly "verified" or "self-skipped." State that plainly, once, as
      # the last thing printed — the self-skip itself is UNCHANGED and still
      # exits 0 by design (a dev-loop run rarely has a built artifact); only
      # the honesty of the aggregate's claim changes.
      - |
        # POSIX-only (Task's built-in interpreter is mvdan/sh, not bash — no
        # `shopt`, no bash arrays, and its bundled `ls`/`find` are NOT drop-in
        # GNU replacements on this host: `find -maxdepth` errored outright,
        # and a no-match `ls` glob wrote its error to STDOUT, not stderr,
        # silently poisoning a `| wc -l` count). A plain `for` glob is POSIX
        # shell syntax the interpreter itself implements, not an external
        # tool: an unmatched glob stays literal (no nullglob), so `-e` must
        # filter it — and that check must be an `if`, not `&&`, because a
        # bare `[ -e "$f" ] && …` whose test is false exits this whole
        # script block non-zero under this interpreter (unlike bash).
        DIR="${OUT_DIR:-$PWD/dist/offline}"
        n=0
        for f in "$DIR"/*.tar.gz; do
          if [ -e "$f" ]; then
            n=$((n + 1))
          fi
        done
        echo "----------------------------------------------------------------"
        if [ "$n" -eq 0 ]; then
          echo "release-check SUMMARY: provenance-check SELF-SKIPPED — no dist/offline/*.tar.gz artifacts were present to verify. This green run does NOT attest release provenance; build + sign artifacts and re-run before cutting a release."
        else
          echo "release-check SUMMARY: provenance-check VERIFIED $n artifact(s) (signature + SBOM coverage) in dist/offline/."
        fi
        echo "release-check: ALL LEGS GREEN"

  sec13-gate:
    desc: "SEC-13(a) grep gate: connector-service is the SOLE credential-decrypt authority — fail if a pgp_sym_decrypt( call or an os.Getenv(\"AIREOS_RESOURCE_SECRET_KEY\") read exists under services/ or packages/ outside services/connector-service. The runtime half of SEC-13 is proven by the e2e leg (api+broker boot with empty keys)."
    cmds:
      - |
        # Guard: a missing scan root must FAIL the gate, not silently pass it
        # (grep's exit 2 would otherwise be swallowed by the `|| true` below).
        [ -d services ] && [ -d packages ] || { echo "SEC-13 gate ERROR: services/ or packages/ not found — run from the repo root"; exit 1; }
        bad=0
        hits="$(grep -rn 'pgp_sym_decrypt(' services packages | grep -v '^services/connector-service' || true)"
        [ -z "$hits" ] || { echo "SEC-13 VIOLATION — pgp_sym_decrypt( outside connector-service:"; echo "$hits"; bad=1; }
        hits="$(grep -rn 'Getenv("AIREOS_RESOURCE_SECRET_KEY")' services packages | grep -v '^services/connector-service' || true)"
        [ -z "$hits" ] || { echo "SEC-13 VIOLATION — AIREOS_RESOURCE_SECRET_KEY read outside connector-service:"; echo "$hits"; bad=1; }
        [ "$bad" = 0 ] && echo "SEC-13(a) gate OK — no decrypt path or key read outside services/connector-service"
        exit "$bad"

  licenses:
    desc: "License posture gate (SC-6; §11a / T-026): every shipped third-party license — Go (the service binaries' full closure) + JS (production deps) — must be in the allowlist (docs/security/license-policy.md); exits non-zero on any unlisted. Needs go + node/pnpm."
    vars:
      ALLOWED: "MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,MPL-2.0,LGPL-2.1,LGPL-3.0,Unlicense,0BSD,CC0-1.0,Python-2.0"
      GO_LICENSES: github.com/google/go-licenses@v1.6.0
    cmds:
      # Go: each shipped service's transitive third-party licenses must be allowed.
      # GOWORK=off (go-licenses rejects workspace mode); --ignore skips first-party.
      - |
        for mod in services/api services/audit-service services/connector-service services/mcp-gateway services/policy-service services/session-broker; do
          (cd "$mod" && GOWORK=off go run {{.GO_LICENSES}} check ./... \
            --allowed_licenses="{{.ALLOWED}}" --ignore aireos.local)
        done
      # JS: production (shipped) dependency licenses only — devDeps are build-time.
      - node infra/scripts/check-js-licenses.mjs "{{.ALLOWED}}"

  # outbox:    added by the first producer ticket (ADR-0045).
  # Note: `task auth rotate-key` (operator key rotation) lands with the operator
  # login HTTP surface / a devops ticket; `task auth -- genkey` is the P0 helper.
