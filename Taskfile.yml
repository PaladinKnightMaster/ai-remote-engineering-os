# Taskfile for AI Remote Engineering OS — ADR-0042.
#
# Canonical entry points (ADR-0042 §Decision):
#   task lint           — code/style/dep checks across Go + TS
#   task test           — unit/integration tests across Go + TS
#   task build          — produce per-service Go binaries + apps/* dist
#   task offline-bundle — populate Go module cache + pnpm content store
#                          for restricted-network install
#
# Targets named by follow-up ADRs land with the tickets that need them:
#   task codegen        — oapi-codegen + openapi-typescript (ADR-0043 / ADR-0047)
#   task migrate        — per-service migrate subcommand    (ADR-0044)
#   task auth rotate-key — packages/go/auth key rotation     (ADR-0046)
#   task outbox         — relay subcommand                    (ADR-0045)
#
# The four canonical entry points are stubbed below to exit 0 with a
# "not-yet-implemented" banner so dormant verification tickets (T-011,
# T-012) can extend them without their "passes on main" criterion
# failing today.

version: '3'

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task -l
    silent: true

  lint:
    desc: "Run all linters. JS-side T-012 + Go-side T-011 close v0.1.0 SEC-7 + SEC-8 release-blockers."
    vars:
      GOLANGCI_LINT: github.com/golangci/golangci-lint/cmd/golangci-lint@v1.61.0
    cmds:
      # === JS side (T-012) ===
      - pnpm -r --if-present run lint
      - node tools/forbidden-deps.mjs
      # === Go side (T-011) ===
      # golangci-lint via go run keeps the binary out of the host
      # toolchain (offline-install posture; ADR-0042 "smallest viable
      # tooling kit"). First run downloads + caches; subsequent runs
      # are fast (gomodcache volume).
      - |
        for mod in packages/go/auth packages/go/middleware packages/go/migrate services/api services/audit-service services/connector-service services/session-broker tools/migrate-lint tools/forbidden-features-check; do
          (cd "$mod" && go run {{.GOLANGCI_LINT}} run ./... --config "$(git rev-parse --show-toplevel)/.golangci.yaml")
        done
      - go run ./tools/migrate-lint services/audit-service/migrations
      - go run ./tools/forbidden-features-check .

  test:
    desc: Run all tests (extended by per-service tickets).
    cmds:
      # audit-service + shared packages (T-004b). Unit tests run here; the
      # store integration tests are tagged `integration` and need a Postgres
      # (see task test-integration).
      # Explicit per-module patterns: a bare ./... or ./packages/go/... does not
      # resolve from the workspace root (the modules live one level deeper).
      - go test ./packages/go/auth/... ./packages/go/middleware/... ./packages/go/migrate/... ./services/api/... ./services/audit-service/... ./services/connector-service/... ./services/session-broker/...
      # JS workspace unit tests (T-007a). `--if-present` skips packages
      # without a `test` script; packages/ui + packages/config have none yet.
      - pnpm -r --if-present run test

  test-integration:
    desc: "Run DB-backed integration tests (needs Postgres; set AUDIT_TEST_DATABASE_URL / CONNECTOR_TEST_DATABASE_URL). ADR-0045 chain-integrity + dedup; ADR-0053 connector credential custody. Tests self-skip when their env var is unset."
    cmds:
      - go test -tags integration ./services/audit-service/internal/store/...
      # connector-service credential custody (ADR-0053; needs CONNECTOR_TEST_DATABASE_URL
      # against a DB with both api + connector migrations applied).
      - go test -tags integration ./services/connector-service/internal/store/...

  validate:
    desc: "Validate the OpenAPI fragment + JSON Schema fixtures (T-010). Needs python3 + jsonschema + pyyaml."
    cmds:
      - python3 infra/scripts/validate_contracts.py

  build:
    desc: Build all Go services and apps/* (extended by per-service tickets).
    cmds:
      - go build -o bin/audit-service ./services/audit-service
      - go build -o bin/api ./services/api
      - go build -o bin/connector-service ./services/connector-service
      - go build -o bin/session-broker ./services/session-broker

  offline-bundle:
    desc: "Build the offline-install bundle (§OI-a, ADR-0051): static linux/amd64 service binaries + SPA + Caddy + config + SHA256 manifest, packaged + OI-4 size-gated. Output: dist/offline/. Build host needs go 1.23 + node 22/pnpm + curl|wget. install.sh + staged postgres packages land in §OI-b."
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm --filter @aireos/web build
      - bash infra/offline/build-bundle.sh

  codegen:
    desc: "Generate per-service Go chi-server stubs + apps/web TS types from the OpenAPI fragment (ADR-0043, ADR-0047; T-014, T-007a). One schema, two consumers."
    vars:
      OAPI_CODEGEN: github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
    cmds:
      # One Go config per service (include-tags slices the canonical contract).
      - go run {{.OAPI_CODEGEN}} --config oapi-codegen.audit.yaml docs/api-contracts/openapi.v3.fragment.yaml
      - go run {{.OAPI_CODEGEN}} --config oapi-codegen.api.yaml docs/api-contracts/openapi.v3.fragment.yaml
      # TS types + openapi-fetch client for the SPA (ADR-0047, T-007a). Same
      # fragment, third consumer. Requires `pnpm install` to have hydrated the
      # workspace; see .github/workflows/ci.yml `js` job for the install loop.
      - pnpm --filter @aireos/shared-types run codegen

  migrate:
    desc: "Run a service's embedded migrations: task migrate -- <service> <up|version|force <v>> (ADR-0044)."
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        svc="$1"; shift
        go run ./services/"$svc" migrate "$@"

  auth:
    desc: "Auth provisioning (ADR-0046): task auth -- genkey | hash <password>. genkey prints a cluster PASETO key; hash prints an argon2id hash for the bootstrap operator."
    cmds:
      - go run ./packages/go/auth/cmd/authctl {{.CLI_ARGS}}

  resources:
    desc: "Resource-secret provisioning (ADR-0048 §7): task resources -- genkey | set-secret <id> --key-file <path> [--passphrase <pp>]. genkey prints a fresh AIREOS_RESOURCE_SECRET_KEY; set-secret pgcrypto-encrypts target SSH credentials onto the resource row (needs API_DATABASE_URL + AIREOS_RESOURCE_SECRET_KEY). NOTE: ADR-0053 relocates custody to connector-service — prefer `task connector` from v0.2.0; this re-points in T-030."
    cmds:
      - go run ./services/api resources {{.CLI_ARGS}}

  connector:
    desc: "connector-service credential custody (ADR-0053): task connector -- set-secret <id> --key-file <path> [--passphrase <pp>] | migrate-legacy. set-secret pgcrypto-encrypts target SSH credentials into connector custody; migrate-legacy backfills existing ciphertext off resources.connection_secret. Needs CONNECTOR_DATABASE_URL + AIREOS_RESOURCE_SECRET_KEY."
    cmds:
      - go run ./services/connector-service credentials {{.CLI_ARGS}}

  e2e:
    desc: "Live SSH end-to-end harness (T-020b): compose up postgres+api+broker+audit+a test sshd, seed keys+resource, run the tagged Go walkthrough, assert the LIVE audit chain (session.open + terminal.input.line + session.close w/ cast SHA). Closes ADR-0045 §Verification 3. On a Windows host, prefix the docker invocation with MSYS_NO_PATHCONV=1."
    dir: infra/docker-compose
    cmds:
      - docker compose -f docker-compose.e2e.yml build
      - defer: docker compose -f docker-compose.e2e.yml down -v
      - docker compose -f docker-compose.e2e.yml run --rm tester

  wd1:
    desc: "WD-1 installed-stack proof (T-021d, ADR-0051): bring up the REAL offline install under systemd-in-Docker + assert the stack is active + the chain-verify CLI (T-021d-a). The full WD-1 walkthrough is T-021d-b. Prereq: the core bundle + the ubuntu2404 postgres companion in dist/offline/ (build them first — see the script's error messages)."
    cmds:
      - bash infra/offline/wd1/run-wd1.sh

  doc-check:
    desc: "Assert every in-repo file path referenced in CANONICAL_SOURCE_OF_TRUTH.md + the ADRs resolves on disk (release-criteria DOC-1; §11a-1). Needs python3."
    cmds:
      - python3 infra/scripts/doc_check.py

  release-check:
    desc: "Release gate aggregator (release-criteria VER-3; §11a-1): run every must-pass gate in sequence, exiting 0 only if all pass. Needs the full toolchain (go + node/pnpm + python3); the integration leg needs a Postgres (set AUDIT_TEST_DATABASE_URL / BROKER_TEST_DATABASE_URL, else those tests self-skip). Intended for the CI host / a full dev env; the offline-only dev box runs the per-leg Docker commands."
    cmds:
      - task: doc-check
      - task: validate
      - task: lint
      - task: licenses
      - task: test
      - task: test-integration
      - pnpm -r run typecheck
      - pnpm --filter @aireos/web run build
      # codegen drift (VER-2): regenerate, then assert the committed output matches.
      - task: codegen
      - cmd: git diff --exit-code
        # A non-empty diff after codegen means the committed generated files are
        # stale (run `task codegen` and commit). Assumes a clean working tree.

  licenses:
    desc: "License posture gate (SC-6; §11a / T-026): every shipped third-party license — Go (the service binaries' full closure) + JS (production deps) — must be in the allowlist (docs/security/license-policy.md); exits non-zero on any unlisted. Needs go + node/pnpm."
    vars:
      ALLOWED: "MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,MPL-2.0,LGPL-2.1,LGPL-3.0,Unlicense,0BSD,CC0-1.0,Python-2.0"
      GO_LICENSES: github.com/google/go-licenses@v1.6.0
    cmds:
      # Go: each shipped service's transitive third-party licenses must be allowed.
      # GOWORK=off (go-licenses rejects workspace mode); --ignore skips first-party.
      - |
        for mod in services/api services/audit-service services/session-broker; do
          (cd "$mod" && GOWORK=off go run {{.GO_LICENSES}} check ./... \
            --allowed_licenses="{{.ALLOWED}}" --ignore aireos.local)
        done
      # JS: production (shipped) dependency licenses only — devDeps are build-time.
      - node infra/scripts/check-js-licenses.mjs "{{.ALLOWED}}"

  # outbox:    added by the first producer ticket (ADR-0045).
  # Note: `task auth rotate-key` (operator key rotation) lands with the operator
  # login HTTP surface / a devops ticket; `task auth -- genkey` is the P0 helper.
